<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CarFox - Sign In</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; color: #0f172a; }
    .wrap { width: min(420px, 92%); margin: 48px auto; background: #fff; border: 1px solid #d9e2ec; border-radius: 12px; padding: 20px; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #64748b; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .password-wrap { position: relative; display: block; }
    .password-wrap input { padding-right: 2.5rem; }
    .toggle-password {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      padding: 0;
      border: 0;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-password:hover { color: #4b5563; }
    .toggle-password svg { width: 1.25rem; height: 1.25rem; display: block; }
    .toggle-password .password-toggle-eye-off { display: none; }
    button { margin-top: 14px; width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #ea580c; color: #fff; font-weight: 700; cursor: pointer; }
    a { color: #ea580c; text-decoration: none; }
    .message { font-size: 0.9rem; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: none; }
    .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .message.success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Sign in to CarFox</h1>
    <p>Welcome back. Enter your account details.</p>
    <p style="font-size:0.85rem;color:#64748b;margin-top:-4px;">For one account everywhere: run <code>npm start</code> and open <strong>http://localhost:3000</strong> (data is stored in the server database). Opening the HTML file directly only keeps accounts in that browser tab.</p>
    <div id="feedback" class="message" role="status" aria-live="polite"></div>
    <form id="signin-form">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" required />
      <label for="password">Password</label>
      <div class="password-wrap">
        <input id="password" type="password" placeholder="Enter password" required autocomplete="current-password" />
        <button type="button" class="toggle-password password-toggle" aria-label="Show password">
          <span class="password-toggle-eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></span>
          <span class="password-toggle-eye-off" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg></span>
        </button>
      </div>
      <button type="submit">Sign In</button>
    </form>
    <p>Do not have an account? <a href="signup.html">Create one</a></p>
    <p><a href="index.html">Back to home</a></p>
  </main>
  <script>
    (function () {
      var USERS_KEY = 'carfox_users';
      var CURRENT_USER_KEY = 'carfox_current_user';
      var TOKEN_KEY = 'carfox_token';
      var form = document.getElementById('signin-form');
      var feedback = document.getElementById('feedback');
      var params = new URLSearchParams(window.location.search);

      function showMessage(type, text) {
        feedback.className = 'message ' + type;
        feedback.textContent = text;
        feedback.style.display = 'block';
      }

      function normEmail(value) {
        return String(value || '').trim().toLowerCase();
      }

      function passwordsMatch(stored, entered) {
        if (stored === entered) return true;
        return String(stored || '').trim() === String(entered || '').trim();
      }

      function getUsers() {
        var backupKey = USERS_KEY + '_backup';
        function parseUsers(raw) {
          if (!raw) return [];
          try {
            var parsed = JSON.parse(raw);
            return Array.isArray(parsed) ? parsed : [];
          } catch (_) {
            return [];
          }
        }
        var users = parseUsers(localStorage.getItem(USERS_KEY));
        if (users.length === 0) {
          var bak = localStorage.getItem(backupKey);
          var restored = parseUsers(bak);
          if (restored.length > 0) {
            try {
              localStorage.setItem(USERS_KEY, bak);
            } catch (_) {}
            users = restored;
          }
        }
        return users;
      }

      if (params.get('created') === '1') {
        showMessage('success', 'Account created successfully. Please sign in.');
      }

      document.querySelectorAll('.password-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var wrap = btn.parentElement;
          var input = wrap.querySelector('input');
          var eye = btn.querySelector('.password-toggle-eye');
          var eyeOff = btn.querySelector('.password-toggle-eye-off');
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          if (eye) eye.style.display = show ? 'none' : '';
          if (eyeOff) eyeOff.style.display = show ? '' : 'none';
          btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
      });

      function finishLogin(user, token) {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({
          fullName: user.fullName,
          email: user.email,
          id: user.id
        }));
        if (token) {
          localStorage.setItem(TOKEN_KEY, token);
        } else {
          localStorage.removeItem(TOKEN_KEY);
        }
        window.location.href = 'index.html?auth=1';
      }

      function tryLocalLogin(email, password) {
        var users = getUsers();
        if (users.length === 0) {
          showMessage(
            'error',
            'No saved accounts here. Run npm start and open http://localhost:3000/login.html to use server accounts, or create an account in this browser only.'
          );
          return;
        }
        var user = users.find(function (item) {
          return normEmail(item.email) === email && passwordsMatch(item.password, password);
        });
        if (!user) {
          var emailExists = users.some(function (item) {
            return normEmail(item.email) === email;
          });
          if (emailExists) {
            showMessage('error', 'Wrong password (offline mode). Check Caps Lock and spaces.');
          } else {
            showMessage('error', 'No account for that email in this browser. Sign up or use the server URL.');
          }
          return;
        }
        finishLogin({ fullName: user.fullName, email: user.email }, null);
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        feedback.style.display = 'none';

        var email = normEmail(document.getElementById('email').value);
        var password = document.getElementById('password').value;
        if (!email || !password) {
          showMessage('error', 'Please enter email and password.');
          return;
        }

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        })
          .then(function (res) {
            return res.json().then(function (data) {
              return { ok: res.ok, status: res.status, data: data };
            });
          })
          .then(function (result) {
            if (result.ok && result.data && result.data.token) {
              finishLogin(result.data.user, result.data.token);
              return;
            }
            var msg = (result.data && result.data.error) || 'Could not sign in.';
            showMessage('error', msg);
          })
          .catch(function () {
            tryLocalLogin(email, password);
          });
      });
    })();
  </script>
</body>
</html>
