    <meta charset="utf-8" />

    <title>CarFox — Vehicle Listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      #vehicle-gallery { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }

      #vehicle-gallery { scrollbar-width: none; }

        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }

        }
      };
    </script>

  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200 h-16">
      <div class="mx-auto max-w-3xl px-4 h-full flex items-center justify-between">
        <a id="backLink" href="/cars.html" class="p-2 -ml-2 text-gray-700 hover:text-gray-900" aria-label="Back">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">

    <div id="pageError" class="hidden px-4 py-16 text-center">

        </div>

      </div>

      <section class="px-4 py-4 bg-white">
        <h1 id="listingTitle" class="text-2xl md:text-3xl font-bold text-gray-900"></h1>
        <p id="listingPrice" class="text-3xl font-bold text-blue-700 mt-2"></p>
      </section>

      <section class="mx-4 mb-4 bg-white border border-gray-200 rounded-lg p-4">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Listed by</p>
        <p id="dealerName" class="text-lg font-semibold text-gray-900 mt-1"></p>
        <span class="inline-flex items-center gap-1 mt-2 rounded-full bg-green-50 text-green-800 text-xs font-semibold px-2.5 py-1 border border-green-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          Verified Dealer
        </span>
        <p id="dealerLocation" class="text-sm text-gray-600 mt-2"></p>
        <p id="dealerPhone" class="hidden text-sm text-gray-700 mt-1"></p>
      </section>

      <section class="px-4 py-4">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Specifications</h2>
        <dl id="specGrid" class="grid grid-cols-2 gap-x-4 gap-y-3"></dl>
      </section>

      <section id="descSection" class="hidden px-4 py-4">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Description</h2>
        <p id="listingDesc" class="text-gray-700 whitespace-pre-line"></p>
      </section>
    </div>

            </svg>
            WhatsApp
          </a>
        </div>
      </div>

    <script type="module">
      import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js';
      let vehicleLightbox = null;
      window.initVehiclePhotoSwipe = function () {
        if (vehicleLightbox) {
          vehicleLightbox.destroy();
          vehicleLightbox = null;
        }
        const gallery = document.getElementById('vehicle-gallery');
        if (!gallery || !gallery.querySelector('a[data-pswp-width]')) return;
        vehicleLightbox = new PhotoSwipeLightbox({
          gallery: '#vehicle-gallery',
          children: 'a',
          pswpModule: function () {
            return import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js');
          }
        });
        vehicleLightbox.init();
      };
    </script>

    <script src="/js/carfox-auth.js"></script>
    <script src="/js/carfox-buyer-nav.js"></script>
    <script>
      (function () {
        const TOKEN_KEY = 'carfox_token';
        const USER_KEY = 'carfox_user';

        let vehicleId = null;
        let currentVehicle = null;
        let photos = [];
        let galleryObserver = null;
        let mainIndex = 0;

        const pageLoading = document.getElementById('pageLoading');
        const pageError = document.getElementById('pageError');
        const pageContent = document.getElementById('pageContent');
        const contactBar = document.getElementById('contactBar');
        const vehicleGallery = document.getElementById('vehicle-gallery');
        const photoCounter = document.getElementById('photoCounter');
        const thumbStrip = document.getElementById('thumbStrip');
        const inquiryBackdrop = document.getElementById('inquiryBackdrop');
        const inquiryPanel = document.getElementById('inquiryPanel');
        const inquiryMessage = document.getElementById('inquiryMessage');
        const charCount = document.getElementById('charCount');

        function parseVehicleId() {
          // Support /cars-detail.html?id=X (dealer profile cards) and /cars/:id
          const sp = new URLSearchParams(window.location.search);
          const qid = parseInt(sp.get('id'), 10);
          if (!isNaN(qid) && qid > 0) return qid;
          const parts = window.location.pathname.split('/').filter(Boolean);
          const last = parts[parts.length - 1];
          const id = parseInt(last, 10);
          return isNaN(id) ? null : id;
        }

        function whatsappDigits(number) {
          let digits = String(number || '').replace(/[\s\-+()]/g, '');
          if (digits.startsWith('0')) {
            digits = '20' + digits.slice(1);
          }
          return digits;
        }

        function buildWhatsAppUrl(dealer, vehicle) {
          const digits = whatsappDigits(dealer && dealer.whatsapp);
          if (!digits) return null;
          const vehicleLabel = [vehicle.year, vehicle.make, vehicle.model].filter(Boolean).join(' ');
          const text =
            "Hi, I'm interested in your " + vehicleLabel + ' listed on CarFox';
          return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
        }

        function updateContactActions(vehicle) {
          const dealer = (vehicle && vehicle.dealer) || {};
          const waUrl = buildWhatsAppUrl(dealer, vehicle);
          console.log('full vehicle object:', JSON.stringify(vehicle));
          console.log('dealer object:', JSON.stringify(dealer));
          console.log('whatsapp value:', dealer.whatsapp);
          console.log('waUrl:', waUrl);
          const contactBtn = document.getElementById('contactDealerBtn');
          const waBtn = document.getElementById('whatsappDealerBtn');

          if (waUrl) {
            waBtn.href = waUrl;
            waBtn.classList.remove('hidden');
            contactBtn.classList.remove('col-span-2');
          } else {
            waBtn.classList.add('hidden');
            waBtn.removeAttribute('href');
            contactBtn.classList.add('col-span-2');
          }
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function formatPrice(cents) {
          if (!cents || cents <= 0) return 'Price on request';
          return Math.round(Number(cents) / 100).toLocaleString('en-EG') + ' EGP';
        }

        function formatMileage(km) {
          if (km == null || km === '' || Number(km) <= 0) return null;
          return Number(km).toLocaleString('en-US') + ' km';
        }

        function getBuyerUser() {
          try {
            const raw = localStorage.getItem(USER_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
          } catch (_) {
            return null;
          }
        }

        function isSignedInBuyer() {
          const token = localStorage.getItem(TOKEN_KEY);
          const user = getBuyerUser();
          return Boolean(token && user && user.role === 'buyer');
        }

        function addSpec(label, value) {
          if (value == null || value === '') return;
          const dt = document.createElement('dt');
          dt.className = 'text-sm text-gray-600';
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.className = 'text-sm font-medium text-gray-900';
          dd.textContent = value;
          document.getElementById('specGrid').appendChild(dt);
          document.getElementById('specGrid').appendChild(dd);
        }

        function carIconSvg() {
          return '<svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M6 11h12l-1-4H7l-1 4z"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>';
        }

        function updatePhotoCounter(idx) {
          const total = photos.length;
          if (!total) {
            photoCounter.textContent = '0 / 0';
            return;
          }
          mainIndex = idx;
          photoCounter.textContent = (idx + 1) + ' / ' + total;
          Array.from(thumbStrip.children).forEach(function (el, i) {
            const active = i === idx;
            el.classList.toggle('border-blue-600', active);
            el.classList.toggle('border-2', active);
            el.classList.toggle('border-gray-200', !active);
            el.classList.toggle('border', !active);
          });
        }

        function scrollToSlide(idx) {
          const slide = vehicleGallery.querySelector('[data-slide-index="' + idx + '"]');
          if (slide) slide.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        }

        function setupGalleryObserver() {
          if (galleryObserver) galleryObserver.disconnect();
          const slides = vehicleGallery.querySelectorAll('.gallery-slide');
          if (!slides.length) return;
          galleryObserver = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                  const idx = Number(entry.target.getAttribute('data-slide-index'));
                  if (!isNaN(idx)) updatePhotoCounter(idx);
                }
              });
            },
            { root: vehicleGallery, threshold: [0.5, 0.75, 1] }
          );
          slides.forEach(function (slide) { galleryObserver.observe(slide); });
        }

        function initPhotoSwipeWhenReady() {
          if (window.initVehiclePhotoSwipe) {
            window.initVehiclePhotoSwipe();
            return;
          }
          requestAnimationFrame(initPhotoSwipeWhenReady);
        }

        function renderGallery() {
          vehicleGallery.innerHTML = '';
          thumbStrip.innerHTML = '';

          if (!photos.length) {
            const slide = document.createElement('div');
            slide.className = 'gallery-slide flex-shrink-0 w-full min-w-full flex items-center justify-center bg-gray-100';
            slide.setAttribute('data-slide-index', '0');
            slide.innerHTML = carIconSvg();
            vehicleGallery.appendChild(slide);
            photoCounter.textContent = '0 / 0';
            return;
          }

          photos.forEach(function (p, i) {
            const slide = document.createElement('div');
            slide.className = 'gallery-slide flex-shrink-0 w-full min-w-full';
            slide.setAttribute('data-slide-index', String(i));
            const link = document.createElement('a');
            link.href = p.url;
            link.setAttribute('data-pswp-width', '1600');
            link.setAttribute('data-pswp-height', '1200');
            link.className = 'block w-full aspect-[4/3]';
            const img = document.createElement('img');
            img.src = p.url;
            img.alt = 'Vehicle photo ' + (i + 1);
            img.className = 'w-full h-full object-cover';
            img.loading = i === 0 ? 'eager' : 'lazy';
            link.appendChild(img);
            slide.appendChild(link);
            vehicleGallery.appendChild(slide);

            const thumb = document.createElement('button');
            thumb.type = 'button';
            thumb.className = 'flex-shrink-0 w-[80px] h-[60px] rounded overflow-hidden border border-gray-200';
            const thumbImg = document.createElement('img');
            thumbImg.src = p.url;
            thumbImg.alt = '';
            thumbImg.className = 'h-full w-full object-cover pointer-events-none';
            thumb.appendChild(thumbImg);
            thumb.addEventListener('click', function () { scrollToSlide(i); });
            thumbStrip.appendChild(thumb);
          });

          updatePhotoCounter(0);
          setupGalleryObserver();
          initPhotoSwipeWhenReady();
        }

        function renderVehicle(v) {
          currentVehicle = v;
          photos = v.photos || [];
          document.title = 'CarFox — ' + [v.year, v.make, v.model].filter(Boolean).join(' ');

          const title = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ');
          document.getElementById('listingTitle').textContent = title;
          document.getElementById('listingPrice').textContent = formatPrice(v.price);

          const dealer = v.dealer || {};
          const dealerNameEl = document.getElementById('dealerName');
          if (dealer.id) {
            dealerNameEl.innerHTML =
              '<a href="/dealer-profile.html?id=' + encodeURIComponent(dealer.id) + '" class="hover:text-blue-700 hover:underline">' +
              escapeHtml(dealer.business_name || 'Dealer') + '</a>';
          } else {
            dealerNameEl.textContent = dealer.business_name || 'Dealer';
          }
          document.getElementById('dealerLocation').textContent =
            [dealer.city, dealer.state].filter(Boolean).join(', ') || '';
          const phoneEl = document.getElementById('dealerPhone');
          if (isSignedInBuyer() && dealer.phone) {
            phoneEl.textContent = dealer.phone;
            phoneEl.classList.remove('hidden');
          } else {
            phoneEl.classList.add('hidden');
          }

          document.getElementById('specGrid').innerHTML = '';
          addSpec('Year', v.year ? String(v.year) : null);
          addSpec('Make', v.make);
          addSpec('Model', v.model);
          addSpec('Trim', v.trim);
          const mileage = formatMileage(v.mileage);
          if (mileage) addSpec('Mileage', mileage);
          addSpec('Body Type', v.body_type);
          addSpec('Transmission', v.transmission);
          addSpec('Fuel Type', v.fuel_type);
          addSpec('Exterior Color', v.exterior_color);
          addSpec('Interior Color', v.interior_color);

          const descSection = document.getElementById('descSection');
          if (v.description && String(v.description).trim()) {
            descSection.classList.remove('hidden');
            document.getElementById('listingDesc').textContent = v.description;
          } else {
            descSection.classList.add('hidden');
          }

          renderGallery();
          updateContactActions(v);
          pageLoading.classList.add('hidden');
          pageContent.classList.remove('hidden');
          contactBar.classList.remove('hidden');

        }

        function recordView() {
          fetch('/api/cars/' + vehicleId + '/view', { method: 'POST' }).catch(function () {});
        }

        async function startConversationAndGoToChat() {
          const v = currentVehicle;
          if (!v || !v.dealer || !v.dealer.id) {
            alert('Could not contact dealer for this listing.');
            return;
          }
          const btn = document.getElementById('contactDealerBtn');
          btn.disabled = true;
          const orig = btn.textContent;
          btn.textContent = 'Opening chat…';
          try {
            const token = localStorage.getItem(TOKEN_KEY);
            const res = await fetch('/api/conversations', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
              },
              body: JSON.stringify({
                dealership_id: v.dealer.id,
                vehicle_id: v.id
              })
            });
            const data = await res.json().catch(function () {
              return {};
            });
            if (res.ok && data.id) {
              let url = '/buyer/chat.html?conversation=' + encodeURIComponent(data.id);
              if (!data.last_message_preview) {
                url += '&prefill=1';
              }
              window.location.href = url;
              return;
            }
            alert(data.error || 'Could not start conversation. Please try again.');
          } catch (_) {
            alert('Network error. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = orig;
          }
        }

        function handleContactClick() {
          if (!isSignedInBuyer()) {
            const returnPath = '/cars/' + vehicleId;
            try {
              localStorage.setItem('return_to', returnPath);
            } catch (_) {}
            window.location.href =
              '/buyer/login.html?returnTo=' + encodeURIComponent(returnPath) + '&action=contact';
            return;
          }
          startConversationAndGoToChat();
        }

        document.getElementById('backLink').addEventListener('click', function (e) {
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });

        document.getElementById('contactDealerBtn').addEventListener('click', handleContactClick);

        if (window.CarfoxAuth) CarfoxAuth.initBuyerNav();
        if (window.CarfoxBuyerNav) CarfoxBuyerNav.initMessagesUnreadBadge();

        // ---- Save / heart button ----
        var detailIsSaved = false;
        var detailBuyerToken = null;

        function updateDetailSaveIcon() {
          var icon = document.getElementById('detailSaveIcon');
          var btn = document.getElementById('detailSaveBtn');
          if (!icon || !btn) return;
          if (detailIsSaved) {
            icon.setAttribute('fill', '#ef4444');
            icon.setAttribute('stroke', 'none');
            icon.innerHTML = '<path d="M12 21s-6.7-4.9-9.3-7.6C.7 11.4.5 8.5 2.2 6.8 3.3 5.7 4.8 5.3 6.2 5.6c.9.2 1.8.8 2.5 1.5.7-.7 1.6-1.3 2.5-1.5 1.4-.3 2.9.1 4 1.2 1.7 1.7 1.5 4.6-.5 6.6C18.7 16.1 12 21 12 21z"/>';
            btn.setAttribute('aria-label', 'Remove from saved');
          } else {
            icon.setAttribute('fill', 'none');
            icon.setAttribute('stroke', 'currentColor');
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>';
            btn.setAttribute('aria-label', 'Save for later');
          }
        }

        function initDetailSave(vId) {
          try {
            detailBuyerToken = localStorage.getItem(TOKEN_KEY) || null;
            if (!detailBuyerToken) return;
            var raw = localStorage.getItem(USER_KEY);
            if (!raw) { detailBuyerToken = null; return; }
            var u = JSON.parse(raw);
            if (!u || u.role !== 'buyer') { detailBuyerToken = null; return; }
          } catch (_) { detailBuyerToken = null; return; }

          fetch('/api/saved-cars', { headers: { Authorization: 'Bearer ' + detailBuyerToken } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (data && Array.isArray(data.saved)) {
                detailIsSaved = data.saved.indexOf(vId) !== -1;
                updateDetailSaveIcon();
              }
            })
            .catch(function () {});

          document.getElementById('detailSaveBtn').addEventListener('click', function () {
            if (!detailBuyerToken) {
              window.location.href = '/buyer/login.html?returnTo=' + encodeURIComponent(window.location.href);
              return;
            }
            var wasSaved = detailIsSaved;
            detailIsSaved = !wasSaved;
            updateDetailSaveIcon();
            fetch('/api/saved-cars/' + vId, {
              method: wasSaved ? 'DELETE' : 'POST',
              headers: { Authorization: 'Bearer ' + detailBuyerToken }
            }).catch(function () {
              detailIsSaved = wasSaved;
              updateDetailSaveIcon();
            });
          });
        }

        vehicleId = parseVehicleId();
        if (!vehicleId) {
          pageLoading.classList.add('hidden');
          pageError.classList.remove('hidden');
          return;
        }
        initDetailSave(vehicleId);

        fetch('/api/cars/' + vehicleId)
          .then(function (res) {
            if (res.status === 404) return null;
            if (!res.ok) throw new Error('load failed');
            return res.json();
          })
          .then(function (data) {
            if (!data || !data.vehicle) {
              pageLoading.classList.add('hidden');
              pageError.classList.remove('hidden');
              return;
            }
            renderVehicle(data.vehicle);
            recordView();
            if (new URLSearchParams(window.location.search).get('openInquiry') === '1' && isSignedInBuyer()) {
              startConversationAndGoToChat();
            }
          })
          .catch(function () {
            pageLoading.classList.add('hidden');
            pageError.classList.remove('hidden');
          });
      })();
    </script>
  </body>
</html>
