<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Vehicle Listing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      #vehicle-gallery { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
      #vehicle-gallery .gallery-slide { scroll-snap-align: start; scroll-snap-stop: always; }
      #vehicle-gallery::-webkit-scrollbar { display: none; }
      #vehicle-gallery { scrollbar-width: none; }
      .gallery-arrow { position:absolute; top:50%; transform:translateY(-50%); width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.92); color:#111827; box-shadow:0 2px 8px rgba(0,0,0,.25); display:none; align-items:center; justify-content:center; z-index:10; }
      .gallery-arrow:hover { background:#fff; }
      .gallery-arrow[disabled] { opacity:.35; cursor:default; }
      @media (min-width: 768px) and (hover: hover) { .gallery-arrow { display:flex; } }
      #vehicle-gallery .gallery-slide img { cursor: zoom-in; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
          }
        }
      };
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200 h-16">
      <div class="mx-auto max-w-3xl px-4 h-full flex items-center justify-between">
        <a id="backLink" href="/cars.html" class="p-2 -ml-2 text-gray-700 hover:text-gray-900" aria-label="Back">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </a>
        <span class="text-sm font-semibold text-gray-700">Listing</span>
        <div class="flex items-center">
        <button type="button" id="detailShareBtn" class="p-2 text-gray-400 hover:text-gray-700" aria-label="Share listing">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8.7 10.7l6.6-3.4M8.7 13.3l6.6 3.4"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="18" r="3"/></svg>
        </button>
        <button type="button" id="detailSaveBtn" class="p-2 text-gray-400 hover:text-gray-700" aria-label="Save for later">
          <svg id="detailSaveIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
        </button>
        </div>
      </div>
    </header>
    <div id="shareToast" class="hidden fixed top-20 inset-x-0 mx-auto w-max max-w-[90%] rounded-lg bg-gray-900 text-white text-sm font-semibold px-4 py-2 shadow-lg z-50">Link copied</div>

    <div id="pageLoading" class="px-4 py-16 text-center text-gray-600">Loading listing…</div>

    <div id="soldBanner" class="hidden mx-4 mt-3 md:mx-auto md:max-w-6xl md:px-6 md:mt-6">
      <div class="rounded-lg border border-gray-300 bg-gray-100 px-4 py-3 text-sm text-gray-800">
        <span class="inline-block rounded bg-gray-900 text-white text-xs font-semibold uppercase tracking-wide px-2 py-0.5 mr-2">Sold</span>
        This car has been sold. <a id="soldSimilarLink" href="/cars.html" class="font-semibold text-blue-700 hover:underline">Browse similar cars</a>
      </div>
    </div>

    <div id="pageError" class="hidden px-4 py-16 text-center">
      <p class="text-lg font-semibold text-gray-900">This listing is no longer available.</p>
      <a href="/cars.html" class="inline-block mt-6 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold px-6 py-3">Back to browse</a>
    </div>

    <div id="pageContent" class="hidden pb-36 md:pb-32">
      <div class="md:mx-auto md:max-w-6xl md:px-6 md:pt-6 md:grid md:grid-cols-12 md:gap-8 md:items-start">
      <!-- Left column on desktop: gallery -->
      <div class="md:col-span-7 md:sticky md:top-20">
      <div class="px-4 py-3 bg-white md:px-0 md:py-0 md:bg-transparent">
        <div class="relative rounded-lg overflow-hidden -mx-0 md:rounded-xl">
          <div id="vehicle-gallery" class="flex overflow-x-auto aspect-[4/3] bg-gray-100"></div>
          <button type="button" id="galleryPrev" class="gallery-arrow left-3" aria-label="Previous photo">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <button type="button" id="galleryNext" class="gallery-arrow right-3" aria-label="Next photo">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
          </button>
          <span id="photoCounter" class="absolute bottom-3 right-3 rounded-md bg-black/70 text-white text-xs px-2 py-1 pointer-events-none z-10">0 / 0</span>
        </div>
        <div id="thumbStrip" class="flex gap-2 overflow-x-auto mt-2 pb-1"></div>
      </div>
      </div>

      <!-- Right column on desktop: price, badges, dealer, specs, features, description -->
      <div class="md:col-span-5 md:min-w-0">
      <section class="px-4 py-4 bg-white md:rounded-xl md:border md:border-gray-200 md:mb-4">
        <h1 id="listingTitle" class="text-2xl md:text-3xl font-bold text-gray-900"></h1>
        <p id="listingPrice" class="text-3xl font-bold text-blue-700 mt-2"></p>
        <div id="trustBadgeWrap" class="hidden mt-3 flex items-center gap-2 flex-wrap"></div>
      </section>

      <section class="mx-4 mb-4 bg-white border border-gray-200 rounded-lg p-4 md:mx-0 md:rounded-xl">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Listed by</p>
        <div class="mt-2 flex items-center gap-3">
          <a id="dealerLogoLink" href="#" class="shrink-0 w-14 h-14 rounded-xl bg-gray-100 border border-gray-200 overflow-hidden flex items-center justify-center">
            <span id="dealerInitials" class="text-lg font-bold text-gray-500">?</span>
            <img id="dealerLogo" alt="" class="hidden w-full h-full object-contain bg-white" />
          </a>
          <div class="min-w-0">
            <p id="dealerName" class="text-lg font-semibold text-gray-900 leading-tight truncate"></p>
            <span class="inline-flex items-center gap-1 mt-1 rounded-full bg-green-50 text-green-800 text-xs font-semibold px-2.5 py-0.5 border border-green-200">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
              Verified Dealer
            </span>
          </div>
        </div>
        <p id="dealerLocation" class="text-sm text-gray-600 mt-2"></p>
        <p id="dealerPhone" class="hidden text-sm text-gray-700 mt-1"></p>
        <a id="dealerAllCarsLink" href="#" class="hidden mt-3 inline-flex items-center gap-1 text-sm font-semibold text-blue-700 hover:underline">View all cars from this dealer →</a>
      </section>

      <section class="px-4 py-4">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Specifications</h2>
        <dl id="specGrid" class="grid grid-cols-2 gap-x-4 gap-y-3"></dl>
      </section>

      <section id="featuresSection" class="hidden px-4 py-4">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Features</h2>
        <div id="featureGroups" class="space-y-4"></div>
      </section>

      <section id="descSection" class="hidden px-4 py-4">
        <h2 class="text-xl font-bold text-gray-900 mb-3">Description</h2>
        <p id="listingDesc" class="text-gray-700 whitespace-pre-line"></p>
      </section>
      </div>
      </div>

      <!-- Similar cars: same make or body type, price within ±30%, hidden when fewer than 2 -->
      <section id="similarSection" class="hidden mt-6 px-4 md:mx-auto md:max-w-6xl md:px-6 scroll-mt-20">
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="text-xl font-bold text-gray-900">Similar cars</h2>
          <a id="similarBrowseLink" href="/cars.html" class="text-sm font-semibold text-blue-700 hover:underline">Browse all →</a>
        </div>
        <div id="similarGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
      </section>
    </div>

    <div id="contactBar" class="hidden fixed bottom-16 left-0 right-0 bg-white border-t border-gray-200 p-4 z-30 md:bottom-0">
      <div class="mx-auto max-w-3xl">
        <div id="contactActions" class="grid grid-cols-2 gap-3">
          <button type="button" id="contactDealerBtn"
                  class="col-span-2 w-full bg-blue-700 hover:bg-blue-800 text-white px-4 py-4 rounded-lg font-semibold text-lg">
            Contact Dealer
          </button>
          <a id="whatsappDealerBtn" href="#" target="_blank" rel="noopener noreferrer"
             class="hidden bg-green-500 hover:bg-green-600 text-white rounded-xl py-3 font-semibold flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.882 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            WhatsApp
          </a>
          <a id="callDealerBtn" href="#"
             class="hidden bg-white border border-blue-700 text-blue-700 hover:bg-blue-50 rounded-xl py-3 font-semibold flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 0 1 2-2h2.6a1 1 0 0 1 .95.68l1.2 3.6a1 1 0 0 1-.25 1.02L8.1 9.7a12.05 12.05 0 0 0 6.2 6.2l1.4-1.4a1 1 0 0 1 1.02-.25l3.6 1.2a1 1 0 0 1 .68.95V19a2 2 0 0 1-2 2h-1C9.7 21 3 14.3 3 6V5z"/></svg>
            Call
          </a>
        </div>
      </div>
    </div>


    <script type="module">
      import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js';
      let vehicleLightbox = null;
      window.initVehiclePhotoSwipe = function () {
        if (vehicleLightbox) {
          vehicleLightbox.destroy();
          vehicleLightbox = null;
        }
        const gallery = document.getElementById('vehicle-gallery');
        if (!gallery || !gallery.querySelector('a[data-pswp-width]')) return;
        vehicleLightbox = new PhotoSwipeLightbox({
          gallery: '#vehicle-gallery',
          children: 'a',
          pswpModule: function () {
            return import('https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js');
          }
        });
        vehicleLightbox.init();
      };
    </script>

    <script src="/js/carfox-trust.js"></script>
    <script src="/js/carfox-value.js"></script>
    <script src="/js/carfox-track.js"></script>
    <script src="/js/carfox-auth.js"></script>
    <script src="/js/carfox-buyer-nav.js"></script>
    <script>
      (function () {
        const TOKEN_KEY = 'carfox_token';
        const USER_KEY = 'carfox_user';

        let vehicleId = null;
        let currentVehicle = null;
        let photos = [];
        let galleryObserver = null;
        let mainIndex = 0;

        const pageLoading = document.getElementById('pageLoading');
        const pageError = document.getElementById('pageError');
        const pageContent = document.getElementById('pageContent');
        const contactBar = document.getElementById('contactBar');
        const vehicleGallery = document.getElementById('vehicle-gallery');
        const photoCounter = document.getElementById('photoCounter');
        const thumbStrip = document.getElementById('thumbStrip');
        const inquiryBackdrop = document.getElementById('inquiryBackdrop');
        const inquiryPanel = document.getElementById('inquiryPanel');
        const inquiryMessage = document.getElementById('inquiryMessage');
        const charCount = document.getElementById('charCount');

        function parseVehicleId() {
          // Support /cars-detail.html?id=X (dealer profile cards) and /cars/:id
          const sp = new URLSearchParams(window.location.search);
          const qid = parseInt(sp.get('id'), 10);
          if (!isNaN(qid) && qid > 0) return qid;
          const parts = window.location.pathname.split('/').filter(Boolean);
          const last = parts[parts.length - 1];
          const id = parseInt(last, 10);
          return isNaN(id) ? null : id;
        }

        function whatsappDigits(number) {
          let digits = String(number || '').replace(/[\s\-+()]/g, '');
          if (digits.startsWith('0')) {
            digits = '20' + digits.slice(1);
          }
          return digits;
        }

        function buildWhatsAppUrl(dealer, vehicle) {
          const digits = whatsappDigits(dealer && dealer.whatsapp);
          if (!digits) return null;
          const vehicleLabel = [vehicle.year, vehicle.make, vehicle.model].filter(Boolean).join(' ');
          const text =
            "Hi, I'm interested in your " + vehicleLabel + ' listed on CarFox';
          return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
        }

        function updateContactActions(vehicle) {
          const dealer = (vehicle && vehicle.dealer) || {};
          const waUrl = buildWhatsAppUrl(dealer, vehicle);
          const contactBtn = document.getElementById('contactDealerBtn');
          const waBtn = document.getElementById('whatsappDealerBtn');
          const callBtn = document.getElementById('callDealerBtn');
          const phoneDigits = dealer.phone ? String(dealer.phone).replace(/[^0-9+]/g, '') : '';

          if (waUrl) {
            waBtn.href = waUrl;
            waBtn.classList.remove('hidden');
          } else {
            waBtn.classList.add('hidden');
            waBtn.removeAttribute('href');
          }
          if (phoneDigits) {
            callBtn.href = 'tel:' + phoneDigits;
            callBtn.classList.remove('hidden');
          } else {
            callBtn.classList.add('hidden');
            callBtn.removeAttribute('href');
          }
          // One extra button sits beside "Contact Dealer"; two go on their own row beneath it.
          const extras = (waUrl ? 1 : 0) + (phoneDigits ? 1 : 0);
          contactBtn.classList.toggle('col-span-2', extras !== 1);
        }

        function track(type) {
          if (window.CarfoxTrack && vehicleId) CarfoxTrack.engagement(type, { vehicleId: vehicleId });
        }

        function shareListing() {
          const url = window.location.origin + '/cars/' + vehicleId;
          const title = document.title;
          track('share');
          if (navigator.share) {
            navigator.share({ title: title, url: url }).catch(function () {});
            return;
          }
          const done = function () {
            const t = document.getElementById('shareToast');
            t.classList.remove('hidden');
            setTimeout(function () { t.classList.add('hidden'); }, 1800);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(done).catch(function () { window.prompt('Copy this link', url); });
          } else {
            window.prompt('Copy this link', url);
          }
        }

        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function formatPrice(cents) {
          if (!cents || cents <= 0) return 'Price on request';
          return Math.round(Number(cents) / 100).toLocaleString('en-EG') + ' EGP';
        }

        function formatMileage(km) {
          if (km == null || km === '' || Number(km) <= 0) return null;
          return Number(km).toLocaleString('en-US') + ' km';
        }

        function getBuyerUser() {
          try {
            const raw = localStorage.getItem(USER_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
          } catch (_) {
            return null;
          }
        }

        function isSignedInBuyer() {
          const token = localStorage.getItem(TOKEN_KEY);
          const user = getBuyerUser();
          return Boolean(token && user && user.role === 'buyer');
        }

        function renderFeatures(list) {
          const section = document.getElementById('featuresSection');
          const host = document.getElementById('featureGroups');
          host.innerHTML = '';
          if (!list || !list.length) { section.classList.add('hidden'); return; }
          const cats = [];
          list.forEach(function (f) { if (cats.indexOf(f.category) === -1) cats.push(f.category); });
          cats.forEach(function (cat) {
            const wrap = document.createElement('div');
            wrap.innerHTML = '<p class="text-xs font-semibold uppercase tracking-wide text-gray-500">' + escapeHtml(cat) + '</p>';
            const ul = document.createElement('ul');
            ul.className = 'mt-2 grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-2';
            list.filter(function (f) { return f.category === cat; }).forEach(function (f) {
              const li = document.createElement('li');
              li.className = 'flex items-center gap-2 text-sm text-gray-800';
              li.innerHTML = '<span class="inline-flex h-5 w-5 items-center justify-center rounded-full bg-green-100 text-green-700 shrink-0"><svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></span><span>' + escapeHtml(f.name) + '</span>';
              ul.appendChild(li);
            });
            wrap.appendChild(ul);
            host.appendChild(wrap);
          });
          section.classList.remove('hidden');
        }

        function addSpec(label, value) {
          if (value == null || value === '') return;
          const dt = document.createElement('dt');
          dt.className = 'text-sm text-gray-600';
          dt.textContent = label;
          const dd = document.createElement('dd');
          dd.className = 'text-sm font-medium text-gray-900';
          dd.textContent = value;
          document.getElementById('specGrid').appendChild(dt);
          document.getElementById('specGrid').appendChild(dd);
        }

        function carIconSvg() {
          return '<svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M6 11h12l-1-4H7l-1 4z"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>';
        }

        function updatePhotoCounter(idx) {
          const total = photos.length;
          if (!total) {
            photoCounter.textContent = '0 / 0';
            return;
          }
          mainIndex = idx;
          photoCounter.textContent = (idx + 1) + ' / ' + total;
          updateGalleryArrows();
          Array.from(thumbStrip.children).forEach(function (el, i) {
            const active = i === idx;
            el.classList.toggle('border-blue-600', active);
            el.classList.toggle('border-2', active);
            el.classList.toggle('border-gray-200', !active);
            el.classList.toggle('border', !active);
          });
        }

        function scrollToSlide(idx) {
          const slide = vehicleGallery.querySelector('[data-slide-index="' + idx + '"]');
          if (slide) slide.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        }

        // Desktop arrows (hidden on touch devices, where the gallery swipes) + keyboard arrows.
        const galleryPrev = document.getElementById('galleryPrev');
        const galleryNext = document.getElementById('galleryNext');
        function updateGalleryArrows() {
          const total = photos.length;
          galleryPrev.disabled = total < 2 || mainIndex <= 0;
          galleryNext.disabled = total < 2 || mainIndex >= total - 1;
          galleryPrev.classList.toggle('!hidden', total < 2);
          galleryNext.classList.toggle('!hidden', total < 2);
        }
        galleryPrev.addEventListener('click', function () { if (mainIndex > 0) scrollToSlide(mainIndex - 1); });
        galleryNext.addEventListener('click', function () { if (mainIndex < photos.length - 1) scrollToSlide(mainIndex + 1); });
        document.addEventListener('keydown', function (e) {
          if (document.querySelector('.pswp--open')) return; // PhotoSwipe handles its own keys
          const tag = (e.target && e.target.tagName) || '';
          if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
          if (e.key === 'ArrowLeft' && mainIndex > 0) scrollToSlide(mainIndex - 1);
          else if (e.key === 'ArrowRight' && mainIndex < photos.length - 1) scrollToSlide(mainIndex + 1);
        });

        function setupGalleryObserver() {
          if (galleryObserver) galleryObserver.disconnect();
          const slides = vehicleGallery.querySelectorAll('.gallery-slide');
          if (!slides.length) return;
          galleryObserver = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                  const idx = Number(entry.target.getAttribute('data-slide-index'));
                  if (!isNaN(idx)) updatePhotoCounter(idx);
                }
              });
            },
            { root: vehicleGallery, threshold: [0.5, 0.75, 1] }
          );
          slides.forEach(function (slide) { galleryObserver.observe(slide); });
        }

        function initPhotoSwipeWhenReady() {
          if (window.initVehiclePhotoSwipe) {
            window.initVehiclePhotoSwipe();
            return;
          }
          requestAnimationFrame(initPhotoSwipeWhenReady);
        }

        function renderGallery() {
          vehicleGallery.innerHTML = '';
          thumbStrip.innerHTML = '';

          if (!photos.length) {
            const slide = document.createElement('div');
            slide.className = 'gallery-slide flex-shrink-0 w-full min-w-full flex items-center justify-center bg-gray-100';
            slide.setAttribute('data-slide-index', '0');
            slide.innerHTML = carIconSvg();
            vehicleGallery.appendChild(slide);
            photoCounter.textContent = '0 / 0';
            updateGalleryArrows();
            return;
          }

          photos.forEach(function (p, i) {
            const slide = document.createElement('div');
            slide.className = 'gallery-slide flex-shrink-0 w-full min-w-full';
            slide.setAttribute('data-slide-index', String(i));
            const link = document.createElement('a');
            link.href = p.url;
            link.setAttribute('data-pswp-width', '1600');
            link.setAttribute('data-pswp-height', '1200');
            link.className = 'block w-full aspect-[4/3]';
            const img = document.createElement('img');
            img.src = p.url;
            img.alt = 'Vehicle photo ' + (i + 1);
            img.className = 'w-full h-full object-cover';
            img.loading = i === 0 ? 'eager' : 'lazy';
            link.appendChild(img);
            slide.appendChild(link);
            vehicleGallery.appendChild(slide);

            const thumb = document.createElement('button');
            thumb.type = 'button';
            thumb.className = 'flex-shrink-0 w-[80px] h-[60px] rounded overflow-hidden border border-gray-200';
            const thumbImg = document.createElement('img');
            thumbImg.src = p.url;
            thumbImg.alt = '';
            thumbImg.className = 'h-full w-full object-cover pointer-events-none';
            thumb.appendChild(thumbImg);
            thumb.addEventListener('click', function () { scrollToSlide(i); });
            thumbStrip.appendChild(thumb);
          });

          updatePhotoCounter(0);
          setupGalleryObserver();
          initPhotoSwipeWhenReady();
        }

        function renderVehicle(v) {
          currentVehicle = v;
          photos = v.photos || [];
          document.title = 'CarFox — ' + [v.year, v.make, v.model].filter(Boolean).join(' ');

          const title = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ');
          document.getElementById('listingTitle').textContent = title;
          if (window.CarfoxTrust) {
            var trustWrap = document.getElementById('trustBadgeWrap');
            trustWrap.innerHTML = (window.CarfoxValue ? CarfoxValue.badge(v, { vehicleId: v.id }) : '') +
              CarfoxTrust.badge(v.trust_score, { vehicleId: v.id }) +
              '<button type="button" data-trust-open="' + v.id + '" class="text-xs font-semibold text-blue-700 hover:underline">How is this scored?</button>';
            trustWrap.classList.remove('hidden');
          }
          document.getElementById('listingPrice').textContent = formatPrice(v.price);

          const dealer = v.dealer || {};
          const dealerNameEl = document.getElementById('dealerName');
          const dealerName = dealer.business_name || 'Dealer';
          const profileHref = dealer.id ? '/dealer-profile.html?id=' + encodeURIComponent(dealer.id) : '';
          if (profileHref) {
            dealerNameEl.innerHTML = '<a href="' + profileHref + '" class="hover:text-blue-700 hover:underline">' + escapeHtml(dealerName) + '</a>';
            document.getElementById('dealerLogoLink').href = profileHref;
            const allLink = document.getElementById('dealerAllCarsLink');
            allLink.href = profileHref;
            allLink.classList.remove('hidden');
          } else {
            dealerNameEl.textContent = dealerName;
          }
          document.getElementById('dealerInitials').textContent = dealerName.charAt(0).toUpperCase();
          if (dealer.logo_url) {
            const logo = document.getElementById('dealerLogo');
            logo.src = dealer.logo_url;
            logo.classList.remove('hidden');
            document.getElementById('dealerInitials').classList.add('hidden');
          }
          document.getElementById('dealerLocation').textContent =
            dealer.governorate || [dealer.city, dealer.state].filter(Boolean).join(', ') || '';
          const phoneEl = document.getElementById('dealerPhone');
          if (isSignedInBuyer() && dealer.phone) {
            phoneEl.textContent = dealer.phone;
            phoneEl.classList.remove('hidden');
          } else {
            phoneEl.classList.add('hidden');
          }

          document.getElementById('specGrid').innerHTML = '';
          addSpec('Year', v.year ? String(v.year) : null);
          addSpec('Make', v.make);
          addSpec('Model', v.model);
          addSpec('Trim', v.trim);
          const mileage = formatMileage(v.mileage);
          if (mileage) addSpec('Mileage', mileage);
          addSpec('Body Type', v.body_type);
          addSpec('Transmission', v.transmission);
          addSpec('Fuel Type', v.fuel_type);
          addSpec('Exterior Color', v.exterior_color);
          addSpec('Interior Color', v.interior_color);
          renderFeatures(v.features || []);

          const descSection = document.getElementById('descSection');
          if (v.description && String(v.description).trim()) {
            descSection.classList.remove('hidden');
            document.getElementById('listingDesc').textContent = v.description;
          } else {
            descSection.classList.add('hidden');
          }

          renderGallery();
          updateContactActions(v);
          pageLoading.classList.add('hidden');
          pageContent.classList.remove('hidden');
          const isSold = v.status === 'sold';
          document.getElementById('soldBanner').classList.toggle('hidden', !isSold);
          contactBar.classList.toggle('hidden', isSold);

        }

        // ---- Similar cars (standard card design, with Value + Trust badges) ----
        function renderSimilarCard(car) {
          const title = [car.year, car.make, car.model].filter(Boolean).join(' ');
          const subtitle = (car.trim && String(car.trim).trim()) || car.body_type || '';
          const city = car.governorate || (car.dealer && car.dealer.city) || '';
          const photoHtml = car.primary_photo_url
            ? '<div class="aspect-[4/3] overflow-hidden bg-gray-100"><img src="' + escapeHtml(car.primary_photo_url) + '" alt="" class="w-full h-full object-cover" loading="lazy" /></div>'
            : '<div class="aspect-[4/3] bg-gray-100 flex items-center justify-center overflow-hidden">' + carIconSvg() + '</div>';
          const card = document.createElement('a');
          card.href = '/cars/' + car.id;
          card.setAttribute('data-car-id', String(car.id));
          card.className = 'block bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-lg transition-shadow';
          card.innerHTML = photoHtml +
            '<div class="p-3">' +
            '<h3 class="text-sm md:text-base font-semibold text-gray-900 truncate">' + escapeHtml(title) + '</h3>' +
            (subtitle ? '<p class="text-xs text-gray-500 mt-0.5 truncate">' + escapeHtml(subtitle) + '</p>' : '') +
            '<div class="mt-2 flex flex-wrap items-center justify-between gap-2"><p class="text-lg font-bold text-blue-700 shrink-0">' + escapeHtml(formatPrice(car.price)) + '</p>' +
              '<span class="flex items-center gap-1 flex-wrap justify-end">' + (window.CarfoxValue ? CarfoxValue.badge(car, { compact: true }) : '') + (window.CarfoxTrust ? CarfoxTrust.badge(car.trust_score, { compact: true }) : '') + '</span></div>' +
            '<div class="flex items-center justify-between text-xs text-gray-500 mt-2">' +
            '<span>' + escapeHtml(formatMileage(car.mileage) || '') + '</span>' +
            '<span class="truncate ml-2 text-right">' + escapeHtml(city) + '</span>' +
            '</div>' +
            (car.dealer_name ? '<div class="mt-1.5 text-xs text-gray-500 truncate">' + escapeHtml(car.dealer_name) + '</div>' : '') +
            '</div>';
          return card;
        }

        function loadSimilarCars(v) {
          const section = document.getElementById('similarSection');
          const grid = document.getElementById('similarGrid');
          const soldLink = document.getElementById('soldSimilarLink');
          const browseLink = document.getElementById('similarBrowseLink');
          section.classList.add('hidden');
          soldLink.href = v.make ? '/cars.html?make=' + encodeURIComponent(v.make) : '/cars.html';
          browseLink.href = soldLink.href;
          fetch('/api/cars/' + v.id + '/similar')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              const cars = (data && data.vehicles) || [];
              if (cars.length < 2) return;
              grid.innerHTML = '';
              cars.forEach(function (car) { grid.appendChild(renderSimilarCard(car)); });
              section.classList.remove('hidden');
              // The sold banner's "Browse similar cars" scrolls down to this section.
              soldLink.href = '#similarSection';
              soldLink.onclick = function (e) {
                e.preventDefault();
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
              };
            })
            .catch(function () {});
        }

        function recordView() {
          fetch('/api/cars/' + vehicleId + '/view', { method: 'POST' }).catch(function () {});
        }

        async function startConversationAndGoToChat() {
          const v = currentVehicle;
          if (!v || !v.dealer || !v.dealer.id) {
            alert('Could not contact dealer for this listing.');
            return;
          }
          const btn = document.getElementById('contactDealerBtn');
          btn.disabled = true;
          const orig = btn.textContent;
          btn.textContent = 'Opening chat…';
          try {
            const token = localStorage.getItem(TOKEN_KEY);
            const res = await fetch('/api/conversations', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token
              },
              body: JSON.stringify({
                dealership_id: v.dealer.id,
                vehicle_id: v.id
              })
            });
            const data = await res.json().catch(function () {
              return {};
            });
            if (res.ok && data.id) {
              let url = '/buyer/chat.html?conversation=' + encodeURIComponent(data.id);
              if (!data.last_message_preview) {
                url += '&prefill=1';
              }
              window.location.href = url;
              return;
            }
            alert(data.error || 'Could not start conversation. Please try again.');
          } catch (_) {
            alert('Network error. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = orig;
          }
        }

        function handleContactClick() {
          track('message');
          if (!isSignedInBuyer()) {
            const returnPath = '/cars/' + vehicleId;
            try {
              localStorage.setItem('return_to', returnPath);
            } catch (_) {}
            window.location.href =
              '/buyer/login.html?returnTo=' + encodeURIComponent(returnPath) + '&action=contact';
            return;
          }
          startConversationAndGoToChat();
        }

        document.getElementById('backLink').addEventListener('click', function (e) {
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });

        document.getElementById('contactDealerBtn').addEventListener('click', handleContactClick);
        document.getElementById('whatsappDealerBtn').addEventListener('click', function () { track('whatsapp'); });
        document.getElementById('callDealerBtn').addEventListener('click', function () { track('call'); });
        document.getElementById('detailShareBtn').addEventListener('click', shareListing);

        if (window.CarfoxAuth) CarfoxAuth.initBuyerNav();
        if (window.CarfoxBuyerNav) CarfoxBuyerNav.initMessagesUnreadBadge();

        // ---- Save / heart button ----
        var detailIsSaved = false;
        var detailBuyerToken = null;

        function updateDetailSaveIcon() {
          var icon = document.getElementById('detailSaveIcon');
          var btn = document.getElementById('detailSaveBtn');
          if (!icon || !btn) return;
          if (detailIsSaved) {
            icon.setAttribute('fill', '#ef4444');
            icon.setAttribute('stroke', 'none');
            icon.innerHTML = '<path d="M12 21s-6.7-4.9-9.3-7.6C.7 11.4.5 8.5 2.2 6.8 3.3 5.7 4.8 5.3 6.2 5.6c.9.2 1.8.8 2.5 1.5.7-.7 1.6-1.3 2.5-1.5 1.4-.3 2.9.1 4 1.2 1.7 1.7 1.5 4.6-.5 6.6C18.7 16.1 12 21 12 21z"/>';
            btn.setAttribute('aria-label', 'Remove from saved');
          } else {
            icon.setAttribute('fill', 'none');
            icon.setAttribute('stroke', 'currentColor');
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>';
            btn.setAttribute('aria-label', 'Save for later');
          }
        }

        var detailSaveBound = false;
        function initDetailSave(vId) {
          var tokenCandidate = null;
          try {
            tokenCandidate = localStorage.getItem(TOKEN_KEY) || null;
            var raw = tokenCandidate ? localStorage.getItem(USER_KEY) : null;
            if (tokenCandidate && !raw) {
              // Token but no cached user yet (e.g. right after OTP verification): resolve the role first.
              if (window.CarfoxAuth) {
                CarfoxAuth.validateBuyerSession().then(function (ok) { if (ok) initDetailSave(vId); });
              }
            } else if (tokenCandidate) {
              var u = JSON.parse(raw);
              if (u && u.role === 'buyer') detailBuyerToken = tokenCandidate;
            }
          } catch (_) { detailBuyerToken = null; }

          if (detailBuyerToken) {
            fetch('/api/saved-cars', { headers: { Authorization: 'Bearer ' + detailBuyerToken } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (data && Array.isArray(data.saved)) {
                detailIsSaved = data.saved.indexOf(vId) !== -1;
                updateDetailSaveIcon();
              }
            })
            .catch(function () {});
          }

          if (detailSaveBound) return;
          detailSaveBound = true;
          document.getElementById('detailSaveBtn').addEventListener('click', function () {
            if (!detailBuyerToken) {
              window.location.href = '/buyer/login.html?returnTo=' + encodeURIComponent(window.location.href);
              return;
            }
            var wasSaved = detailIsSaved;
            detailIsSaved = !wasSaved;
            updateDetailSaveIcon();
            fetch('/api/saved-cars/' + vId, {
              method: wasSaved ? 'DELETE' : 'POST',
              headers: { Authorization: 'Bearer ' + detailBuyerToken }
            }).catch(function () {
              detailIsSaved = wasSaved;
              updateDetailSaveIcon();
            });
          });
        }

        vehicleId = parseVehicleId();
        if (!vehicleId) {
          pageLoading.classList.add('hidden');
          pageError.classList.remove('hidden');
          return;
        }
        initDetailSave(vehicleId);

        var detailHeaders = {};
        try { if (localStorage.getItem('carfox_token')) detailHeaders.Authorization = 'Bearer ' + localStorage.getItem('carfox_token'); } catch (_) {}
        fetch('/api/cars/' + vehicleId, { headers: detailHeaders })
          .then(function (res) {
            if (res.status === 404) return null;
            if (!res.ok) throw new Error('load failed');
            return res.json();
          })
          .then(function (data) {
            if (!data || !data.vehicle) {
              pageLoading.classList.add('hidden');
              pageError.classList.remove('hidden');
              return;
            }
            renderVehicle(data.vehicle);
            loadSimilarCars(data.vehicle);
            if (data.vehicle.status !== 'sold') recordView(); // views only count for live listings
            if (new URLSearchParams(window.location.search).get('openInquiry') === '1' && isSignedInBuyer() && data.vehicle.status !== 'sold') {
              startConversationAndGoToChat();
            }
          })
          .catch(function () {
            pageLoading.classList.add('hidden');
            pageError.classList.remove('hidden');
          });
      })();
    </script>
  </body>
</html>
