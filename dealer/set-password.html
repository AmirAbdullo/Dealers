<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>CarFox — Set your dealer password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1f3d" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <script src="/js/carfox-pwa.js" defer></script>
    <script src="/js/carfox-ui.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-white text-gray-900 font-sans">
    <main class="min-h-screen flex items-start justify-center px-4 sm:px-6 lg:px-8 py-10">
      <div class="w-full max-w-md">
        <header class="mb-6">
          <div class="text-2xl font-extrabold tracking-tight">
            <span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span>
          </div>
          <h1 class="mt-2 text-xl font-semibold">Set your dealer password</h1>
          <p id="intro" class="mt-1 text-sm text-gray-600">Checking your invite link…</p>
        </header>

        <!-- Link problems (expired / used / replaced / invalid) -->
        <section id="linkProblem" class="hidden rounded-xl border border-amber-200 bg-amber-50 p-5 text-sm text-amber-900" role="alert">
          <p id="linkProblemText" class="font-medium"></p>
          <p class="mt-3 flex flex-wrap gap-x-4 gap-y-1">
            <a id="linkProblemLogin" href="/dealer/login.html" class="hidden font-semibold text-blue-700 hover:underline">Go to dealer sign in</a>
            <a href="/dealer/signup.html" class="font-semibold text-blue-700 hover:underline">Contact the CarFox team</a>
          </p>
        </section>

        <section id="formCard" class="hidden bg-white border border-gray-200 rounded-xl shadow-sm p-5 sm:p-6">
          <dl class="mb-4 rounded-lg bg-gray-50 px-3 py-2.5 text-sm">
            <div class="flex gap-2"><dt class="text-gray-500 w-20 shrink-0">Dealership</dt><dd id="whoBusiness" class="font-semibold text-gray-900 min-w-0 break-words"></dd></div>
            <div class="flex gap-2 mt-1"><dt class="text-gray-500 w-20 shrink-0">Email</dt><dd id="whoEmail" class="text-gray-900 min-w-0 break-all"></dd></div>
          </dl>
          <form id="setForm" class="space-y-4" novalidate>
            <!-- Lets password managers save the login against the right email -->
            <input id="username" type="email" autocomplete="username" class="hidden" tabindex="-1" aria-hidden="true" />
            <div>
              <label for="password" class="block text-sm font-medium text-gray-700">New password</label>
              <div class="relative mt-1">
                <input id="password" type="password" autocomplete="new-password" required
                       class="block w-full px-3 py-2 pr-10 text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Show password">
                  <span class="password-toggle-eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></span>
                  <span class="password-toggle-eye-off hidden" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg></span>
                </button>
              </div>
              <ul id="rules" class="mt-2 space-y-1" aria-live="polite"></ul>
            </div>
            <div>
              <label for="confirm" class="block text-sm font-medium text-gray-700">Confirm password</label>
              <div class="relative mt-1">
                <input id="confirm" type="password" autocomplete="new-password" required
                       class="block w-full px-3 py-2 pr-10 text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Show password">
                  <span class="password-toggle-eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></span>
                  <span class="password-toggle-eye-off hidden" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg></span>
                </button>
              </div>
              <p id="mismatch" class="hidden mt-1 text-xs text-red-600">Passwords don't match.</p>
            </div>
            <p id="formError" class="hidden text-sm text-red-700" role="alert"></p>
            <button id="submitBtn" type="submit" disabled
                    class="w-full inline-flex items-center justify-center rounded-lg bg-blue-700 hover:bg-blue-800 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-4 py-3 transition">
              Set password and sign in
            </button>
          </form>
        </section>
      </div>
    </main>

    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        // Same rules the server enforces (passwordRuleError) and the account settings sheet shows.
        const RULES = [
          { key: 'length', label: 'At least 8 characters', test: (p) => p.length >= 8 },
          { key: 'number', label: 'At least one number (0-9)', test: (p) => /[0-9]/.test(p) },
          { key: 'upper', label: 'At least one uppercase letter (A-Z)', test: (p) => /[A-Z]/.test(p) },
          { key: 'lower', label: 'At least one lowercase letter (a-z)', test: (p) => /[a-z]/.test(p) },
          { key: 'special', label: 'At least one special character (!@#$%^&*.)', test: (p) => /[^A-Za-z0-9]/.test(p) }
        ];

        // The token travels in the URL fragment (never sent to the server in a URL); take it and drop it from
        // the address bar so it isn't left in history.
        const token = new URLSearchParams(location.hash.replace(/^#/, '')).get('token') || '';
        if (location.hash) history.replaceState(null, '', location.pathname);

        function problem(message, code) {
          $('intro').textContent = 'This invite link can’t be used.';
          $('linkProblemText').textContent = message;
          $('linkProblemLogin').classList.toggle('hidden', code !== 'used');
          $('formCard').classList.add('hidden');
          $('linkProblem').classList.remove('hidden');
        }

        $('rules').innerHTML = RULES.map((r) =>
          '<li class="flex items-center gap-2 text-xs" data-rule="' + r.key + '"><span class="w-3 text-gray-400" data-icon>•</span><span class="text-gray-500" data-text>' + r.label + '</span></li>'
        ).join('');

        function check() {
          const p = $('password').value;
          const c = $('confirm').value;
          let allOk = true;
          RULES.forEach((r) => {
            const ok = r.test(p);
            if (!ok) allOk = false;
            const li = document.querySelector('[data-rule="' + r.key + '"]');
            const touched = p.length > 0;
            li.querySelector('[data-icon]').textContent = ok ? '✓' : touched ? '✗' : '•';
            li.querySelector('[data-icon]').className = 'w-3 ' + (ok ? 'text-green-600' : touched ? 'text-red-500' : 'text-gray-400');
            li.querySelector('[data-text]').className = ok ? 'text-green-700' : touched ? 'text-red-500' : 'text-gray-500';
          });
          $('mismatch').classList.toggle('hidden', !(c.length > 0 && c !== p));
          $('submitBtn').disabled = !(allOk && c === p);
        }
        ['password', 'confirm'].forEach((id) => $(id).addEventListener('input', () => { $('formError').classList.add('hidden'); check(); }));

        document.querySelectorAll('.password-toggle').forEach((btn) => {
          btn.addEventListener('click', () => {
            const input = btn.parentElement.querySelector('input');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            btn.querySelector('.password-toggle-eye').classList.toggle('hidden', show);
            btn.querySelector('.password-toggle-eye-off').classList.toggle('hidden', !show);
            btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          });
        });

        async function post(path, body) {
          const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          return { ok: res.ok, status: res.status, body: await res.json().catch(() => ({})) };
        }

        if (!token) {
          problem('This page needs the invite link from your email. Open the link exactly as it arrived.', 'invalid');
          return;
        }

        post('/api/auth/dealer-invite/check', { token: token }).then((r) => {
          if (!r.ok) { problem(r.body.error || 'This invite link can’t be used.', r.body.code); return; }
          const name = r.body.full_name ? String(r.body.full_name).split(' ')[0] : '';
          $('intro').textContent = (name ? 'Welcome, ' + name + '. ' : 'Welcome. ') + 'Choose a password to activate your dealer account.';
          $('whoBusiness').textContent = r.body.business_name || '—';
          $('whoEmail').textContent = r.body.email || '';
          $('username').value = r.body.email || '';
          $('formCard').classList.remove('hidden');
          $('password').focus();
        }).catch(() => problem('Could not check your invite link. Check your connection and reload the page.', 'network'));

        $('setForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          check();
          if ($('submitBtn').disabled) return;
          const btn = $('submitBtn');
          btn.disabled = true;
          btn.textContent = 'Setting password…';
          try {
            const r = await post('/api/auth/dealer-invite/accept', { token: token, password: $('password').value, confirm_password: $('confirm').value });
            if (r.ok && r.body.token) {
              // Dealer session keys (a buyer session in this browser is left alone).
              try {
                localStorage.setItem('carfox_dealer_token', r.body.token);
                localStorage.setItem('carfox_dealer_user', JSON.stringify(r.body.user));
              } catch (_) {}
              window.location.replace('/dealer/dashboard.html');
              return;
            }
            if (r.body.code) { problem(r.body.error, r.body.code); return; }
            $('formError').textContent = r.body.error || 'Could not set your password. Please try again.';
            $('formError').classList.remove('hidden');
          } catch (_) {
            $('formError').textContent = 'Network error. Please try again.';
            $('formError').classList.remove('hidden');
          }
          btn.textContent = 'Set password and sign in';
          check();
        });
      })();
    </script>
  </body>
</html>
