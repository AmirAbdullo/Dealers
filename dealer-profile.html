<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Dealer Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/carfox-brand.css" />
    <style>
      #dealerMap { height: 220px; }
      @media (min-width: 768px) { #dealerMap { height: 300px; } }
      .leaflet-container { font-family: inherit; }
    </style>
      <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1f3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CarFox" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <script>
      // Start loading the dealer + first page of inventory right away, in parallel with the page's scripts.
      (function () {
        var id = parseInt(new URLSearchParams(location.search).get('id'), 10);
        if (id > 0) window.__cfDealerProfile = fetch('/api/dealers/' + id + '/profile');
      })();
    </script>
    <script src="/js/carfox-pwa.js" defer></script>
    <script src="/js/carfox-ui.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans min-h-screen pb-24 md:pb-10">

    <header class="sticky top-0 z-40 bg-white border-b border-gray-200 h-14">
      <div class="mx-auto max-w-5xl px-4 h-full flex items-center justify-between">
        <a id="backLink" href="/cars.html" class="p-2 -ml-2 text-gray-700 hover:text-gray-900" aria-label="Back">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </a>
        <span class="text-sm font-semibold text-gray-700">Dealer Profile</span>
        <a href="/" class="text-lg font-extrabold tracking-tight"><span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span></a>
      </div>
    </header>

    <!-- Loading: header card + inventory grid placeholders in the real layout -->
    <div id="pageLoading" class="max-w-5xl mx-auto px-4 py-4" aria-busy="true" aria-label="Loading dealer profile">
      <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start gap-4">
          <div class="cf-skel shrink-0 w-20 h-20 md:w-24 md:h-24 rounded-2xl"></div>
          <div class="flex-1 space-y-2.5 pt-1">
            <div class="cf-skel h-6 w-2/3"></div>
            <div class="cf-skel h-4 w-1/3"></div>
            <div class="cf-skel h-3 w-1/4"></div>
          </div>
        </div>
        <div class="mt-4 flex gap-2"><div class="cf-skel h-10 flex-1"></div><div class="cf-skel h-10 flex-1"></div></div>
      </div>
      <div class="mt-6 mb-3 cf-skel h-7 w-40"></div>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" data-cf-skeleton="grid:6"></div>
    </div>

    <div id="pageError" class="hidden px-4 py-16 text-center">
      <p class="text-lg font-semibold text-gray-900">Dealer not found.</p>
      <a href="/cars.html" class="inline-block mt-6 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold px-6 py-3">Back to browse</a>
    </div>

    <main id="pageContent" class="hidden max-w-5xl mx-auto px-4 py-4">
      <!-- 1. Dealer header card -->
      <section class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm">
        <div class="flex items-start gap-4">
          <div class="shrink-0 w-20 h-20 md:w-24 md:h-24 rounded-2xl bg-gray-100 border border-gray-200 overflow-hidden flex items-center justify-center">
            <span id="dealerInitials" class="text-2xl font-bold text-gray-500">?</span>
            <img id="dealerLogo" alt="" class="hidden w-full h-full object-contain bg-white" />
          </div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <h1 id="dealerName" class="text-xl md:text-2xl font-bold text-gray-900 leading-tight"></h1>
              <span class="inline-flex items-center gap-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 border border-blue-200 shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
                Verified
              </span>
            </div>
            <p class="mt-1 text-sm text-gray-600 flex items-center gap-1">
              <svg class="h-4 w-4 text-gray-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6-5.3-6-11a6 6 0 1 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
              <span id="dealerLocationText"></span>
            </p>
            <p id="dealerMemberSince" class="text-xs text-gray-500 mt-1"></p>
            <a id="dealerWebsite" href="#" target="_blank" rel="noopener noreferrer" class="hidden mt-1 inline-flex items-center gap-1 text-sm font-semibold text-blue-700 hover:underline">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
              <span id="dealerWebsiteText"></span>
            </a>
          </div>
        </div>

        <div class="mt-4 flex gap-2">
          <a id="whatsappBtn" href="#" target="_blank" rel="noopener noreferrer" class="hidden flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-semibold py-2.5">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 1.8a8.2 8.2 0 1 1-4.2 15.3l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 0 1 12 3.8zm-3.3 4.4c-.2 0-.5.1-.7.3-.3.3-1 1-1 2.3s1 2.7 1.2 2.9c.1.2 2 3.2 5 4.4 2.5 1 3 .8 3.5.7.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3l-2-.9c-.3-.1-.5-.2-.7.1l-.9 1.1c-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.5-1.7-1.6-2-.2-.3 0-.5.1-.6l.5-.6.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.5-.4-.5-.6-.5h-.6z"/></svg>
            WhatsApp
          </a>
          <a id="callBtn" href="#" class="hidden flex-1 inline-flex items-center justify-center gap-1.5 rounded-lg border border-blue-700 text-blue-700 hover:bg-blue-50 text-sm font-semibold py-2.5">
            <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 0 1 2-2h2.6a1 1 0 0 1 .95.68l1.2 3.6a1 1 0 0 1-.25 1.02L8.1 9.7a12.05 12.05 0 0 0 6.2 6.2l1.4-1.4a1 1 0 0 1 1.02-.25l3.6 1.2a1 1 0 0 1 .68.95V19a2 2 0 0 1-2 2h-1C9.7 21 3 14.3 3 6V5z"/></svg>
            Call
          </a>
        </div>
        <p id="contactNote" class="hidden mt-2 text-xs text-gray-500">This dealer has not added contact details yet. Message them from any of their listings.</p>
      </section>

      <!-- 2. Inventory, straight after the header -->
      <!-- id is not "inventory" on purpose: the browser's own #inventory jump would fire when this appears and hide
           the dealer header even when the cars are already on screen; the script below decides instead. -->
      <section id="inventorySection" class="mt-6 scroll-mt-20" aria-labelledby="inventoryTitle">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
          <h2 id="inventoryTitle" class="text-xl font-bold text-gray-900">Inventory <span id="inventoryCount" class="font-semibold text-gray-500"></span></h2>
          <div id="conditionTabs" class="hidden inline-flex rounded-full bg-gray-100 p-1 text-sm font-semibold" role="tablist" aria-label="Filter by condition">
            <button type="button" role="tab" data-cond="all" class="cond-tab rounded-full px-4 py-1.5">All <span data-count class="font-normal"></span></button>
            <button type="button" role="tab" data-cond="new" class="cond-tab rounded-full px-4 py-1.5">New <span data-count class="font-normal"></span></button>
            <button type="button" role="tab" data-cond="used" class="cond-tab rounded-full px-4 py-1.5">Used <span data-count class="font-normal"></span></button>
          </div>
        </div>
        <div id="vehicleGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3" aria-live="polite"></div>
        <div id="tabEmpty" class="hidden rounded-xl border border-gray-200 bg-white p-8 text-center text-gray-600"></div>
        <div id="emptyState" class="hidden rounded-xl border border-gray-200 bg-white p-8 text-center text-gray-600">This dealer has no active listings right now.</div>
        <div class="mt-4 text-center">
          <button type="button" id="moreBtn" class="hidden rounded-xl border border-gray-300 bg-white px-6 py-2.5 text-sm font-semibold text-gray-800 hover:border-gray-400 disabled:opacity-60">Show more cars</button>
        </div>
      </section>

      <!-- 3. Location, at the bottom (Leaflet loads only when this is about to scroll into view) -->
      <section id="mapSection" class="hidden mt-8 bg-white border border-gray-200 rounded-2xl overflow-hidden shadow-sm">
        <div class="px-4 py-3 flex items-center justify-between">
          <h2 class="font-semibold text-gray-900">Location</h2>
          <a id="directionsLink" href="#" target="_blank" rel="noopener noreferrer" class="text-sm font-semibold text-blue-700 hover:underline">Open in maps</a>
        </div>
        <div id="dealerMap" class="relative z-0 w-full bg-gray-100"></div>
        <p id="mapNote" class="hidden px-4 py-2 text-xs text-gray-500 bg-gray-50">Approximate location based on governorate.</p>
      </section>
    </main>

    <script src="/js/carfox-trust.js"></script>
    <script src="/js/carfox-card.js"></script>
    <script src="/js/carfox-value.js"></script>
    <script src="/js/carfox-track.js"></script>
    <script src="/js/carfox-auth.js"></script>
    <script src="/js/carfox-pill-nav.js"></script>
    <script src="/js/carfox-buyer-nav.js"></script>
    <script src="/js/carfox-geo.js"></script>
    <script>
      (function () {
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const LEAFLET_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        const LEAFLET_JS = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';

        function whatsappDigits(raw) {
          let d = String(raw || '').replace(/[^0-9]/g, '');
          if (!d) return '';
          if (d.indexOf('00') === 0) d = d.slice(2);
          else if (d.indexOf('0') === 0) d = '20' + d.slice(1);
          return d;
        }

        function renderCard(car) {
          return CarfoxCard.render(car, { variant: 'grid', actions: false, dealerRow: false });
        }

        // ---- Location (bottom of the page): Leaflet is fetched only when the card nears the viewport ----
        let leafletPromise = null;
        function loadLeaflet() {
          if (window.L) return Promise.resolve();
          if (!leafletPromise) {
            leafletPromise = new Promise(function (resolve, reject) {
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.href = LEAFLET_CSS;
              document.head.appendChild(link);
              const s = document.createElement('script');
              s.src = LEAFLET_JS;
              s.onload = resolve;
              s.onerror = reject;
              document.head.appendChild(s);
            });
          }
          return leafletPromise;
        }
        function setupMap(dealer) {
          let coords = (dealer.lat != null && dealer.lng != null && CarfoxGeo.isInEgypt(Number(dealer.lat), Number(dealer.lng))) ? [Number(dealer.lat), Number(dealer.lng)] : null;
          let approximate = false;
          if (!coords) { coords = CarfoxGeo.centroidFor(dealer.governorate); approximate = !!coords; }
          if (!coords) return;
          $('mapSection').classList.remove('hidden');
          $('mapNote').classList.toggle('hidden', !approximate);
          $('directionsLink').href = 'https://www.openstreetmap.org/?mlat=' + coords[0] + '&mlon=' + coords[1] + '#map=15/' + coords[0] + '/' + coords[1];
          let drawn = false;
          const draw = function () {
            if (drawn) return;
            drawn = true;
            loadLeaflet().then(function () {
              const map = L.map('dealerMap', { scrollWheelZoom: false }).setView(coords, approximate ? 11 : 15);
              L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
              L.marker(coords).addTo(map).bindPopup(esc(dealer.business_name || 'Dealer'));
              setTimeout(() => map.invalidateSize(), 200);
            }).catch(function () {
              $('dealerMap').innerHTML = '<p class="px-4 py-8 text-center text-sm text-gray-500">The map could not be loaded. Use “Open in maps” above.</p>';
            });
          };
          if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver(function (entries) {
              if (entries.some((e) => e.isIntersecting)) { io.disconnect(); draw(); }
            }, { rootMargin: '400px 0px' });
            io.observe($('mapSection'));
          } else {
            draw();
          }
        }

        // ---- Header card ----
        function renderHeader(dealer) {
          const name = dealer.business_name || 'Dealer';
          document.title = 'CarFox — ' + name;
          $('dealerName').textContent = name;
          $('dealerInitials').textContent = name.charAt(0).toUpperCase();
          if (dealer.logo_url) {
            const img = $('dealerLogo');
            img.src = dealer.logo_url;
            img.classList.remove('hidden');
            $('dealerInitials').classList.add('hidden');
          }
          $('dealerLocationText').textContent = dealer.governorate || dealer.city || 'Egypt';
          $('dealerMemberSince').textContent = dealer.member_since ? 'Member since ' + dealer.member_since : '';
          if (dealer.website) {
            const a = $('dealerWebsite');
            a.href = dealer.website;
            $('dealerWebsiteText').textContent = dealer.website.replace(/^https?:\/\//, '').replace(/\/$/, '');
            a.classList.remove('hidden');
          }
          const wa = whatsappDigits(dealer.whatsapp);
          if (wa) {
            $('whatsappBtn').href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Hi, I found ' + name + ' on CarFox and would like to ask about your cars.');
            $('whatsappBtn').classList.remove('hidden');
          }
          if (dealer.phone) {
            $('callBtn').href = 'tel:' + String(dealer.phone).replace(/[^0-9+]/g, '');
            $('callBtn').classList.remove('hidden');
          }
          if (!wa && !dealer.phone) $('contactNote').classList.remove('hidden');
          const track = (type) => { if (window.CarfoxTrack) CarfoxTrack.engagement(type, { dealershipId: dealer.id }); };
          $('whatsappBtn').addEventListener('click', () => track('whatsapp'));
          $('callBtn').addEventListener('click', () => track('call'));
          $('dealerWebsite').addEventListener('click', () => track('website'));
        }

        // ---- Inventory: All / New / Used tabs, 24 cards per page, "Show more" ----
        // Each tab keeps its own loaded list. When the whole inventory fits in the first page, New / Used are
        // filtered locally; otherwise a tab fetches its own pages from the server.
        const grid = $('vehicleGrid');
        const condOf = (car) => (car.condition === 'new' ? 'new' : 'used');
        const lists = {};
        let counts = { all: 0, new: 0, used: 0 };
        let current = 'all';
        let dealerId = 0;

        function profileUrl(cond, offset) {
          return '/api/dealers/' + dealerId + '/profile?condition=' + cond + '&offset=' + offset;
        }
        function paint(cond, appended) {
          const state = lists[cond];
          if (appended) {
            const frag = document.createDocumentFragment();
            appended.forEach((car) => frag.appendChild(renderCard(car)));
            grid.appendChild(frag);
          } else {
            grid.innerHTML = '';
            const frag = document.createDocumentFragment();
            state.items.forEach((car) => frag.appendChild(renderCard(car)));
            grid.appendChild(frag);
            if (window.CarfoxUI && CarfoxUI.stagger) CarfoxUI.stagger(grid);
          }
          const tabEmpty = $('tabEmpty');
          tabEmpty.textContent = cond === 'new' ? 'No new cars from this dealer right now.' : 'No used cars from this dealer right now.';
          tabEmpty.classList.toggle('hidden', !!state.items.length || !counts.all);
          $('moreBtn').classList.toggle('hidden', !state.hasMore);
        }
        function setTabs(cond) {
          document.querySelectorAll('#conditionTabs [data-cond]').forEach((t) => {
            const on = t.dataset.cond === cond;
            t.setAttribute('aria-selected', on ? 'true' : 'false');
            t.className = 'cond-tab rounded-full px-4 py-1.5 ' + (on ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:text-gray-900') +
              (counts[t.dataset.cond] ? '' : ' opacity-40 cursor-not-allowed');
          });
        }
        function showTab(cond) {
          current = cond;
          setTabs(cond);
          if (lists[cond]) { paint(cond); return; }
          grid.innerHTML = window.CarfoxUI ? CarfoxUI.skeleton('grid', Math.min(6, counts[cond] || 3)) : '';
          $('moreBtn').classList.add('hidden');
          $('tabEmpty').classList.add('hidden');
          fetch(profileUrl(cond, 0))
            .then((r) => { if (!r.ok) throw new Error('load'); return r.json(); })
            .then((data) => {
              lists[cond] = { items: data.vehicles || [], hasMore: !!data.has_more };
              if (current === cond) paint(cond);
            })
            .catch(() => {
              if (current !== cond) return;
              grid.innerHTML = '';
              if (window.CarfoxUI) CarfoxUI.toast('Could not load cars. Please try again.', { kind: 'error' });
            });
        }
        $('moreBtn').addEventListener('click', function () {
          const btn = this;
          const cond = current;
          const state = lists[cond];
          if (!state || !state.hasMore) return;
          btn.disabled = true;
          btn.textContent = 'Loading…';
          fetch(profileUrl(cond, state.items.length))
            .then((r) => { if (!r.ok) throw new Error('load'); return r.json(); })
            .then((data) => {
              const seen = new Set(state.items.map((c) => c.id));
              const more = (data.vehicles || []).filter((c) => !seen.has(c.id));
              state.items = state.items.concat(more);
              state.hasMore = !!data.has_more && more.length > 0;
              if (current === cond) paint(cond, more);
            })
            .catch(() => { if (window.CarfoxUI) CarfoxUI.toast('Could not load more cars. Please try again.', { kind: 'error' }); })
            .finally(() => { btn.disabled = false; btn.textContent = 'Show more cars'; });
        });

        function renderInventory(data) {
          counts = data.counts || { all: (data.vehicles || []).length, new: 0, used: 0 };
          const first = data.vehicles || [];
          lists.all = { items: first, hasMore: !!data.has_more };
          if (!data.has_more) {
            // Everything is loaded: New / Used come from the same list, no extra requests.
            lists.new = { items: first.filter((c) => condOf(c) === 'new'), hasMore: false };
            lists.used = { items: first.filter((c) => condOf(c) === 'used'), hasMore: false };
          }
          $('inventoryCount').textContent = '(' + counts.all + ')';
          document.querySelectorAll('#conditionTabs [data-cond]').forEach((t) => {
            t.querySelector('[data-count]').textContent = '(' + counts[t.dataset.cond] + ')';
            t.disabled = !counts[t.dataset.cond];
            t.addEventListener('click', () => { if (!t.disabled && t.dataset.cond !== current) showTab(t.dataset.cond); });
          });
          if (!counts.all) $('emptyState').classList.remove('hidden');
          else $('conditionTabs').classList.remove('hidden');
          setTabs('all');
          paint('all');
        }

        function render(data) {
          renderHeader(data.dealer || {});
          $('pageLoading').classList.add('hidden');
          $('pageContent').classList.remove('hidden');
          renderInventory(data);
          setupMap(data.dealer || {});
          // From a listing's "Inventory" tile (#inventory): make sure the cars are on screen, without hiding the
          // dealer header when the grid already starts above the fold.
          if (location.hash === '#inventory') {
            const top = $('inventorySection').getBoundingClientRect().top;
            if (top > window.innerHeight * 0.55) $('inventorySection').scrollIntoView({ block: 'start' });
          }
        }

        $('backLink').addEventListener('click', function (e) {
          if (window.history.length > 1) { e.preventDefault(); window.history.back(); }
        });

        dealerId = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
        if (!dealerId) {
          $('pageLoading').classList.add('hidden');
          $('pageError').classList.remove('hidden');
          return;
        }
        (window.__cfDealerProfile || fetch('/api/dealers/' + dealerId + '/profile'))
          .then((res) => { if (res.status === 404) return null; if (!res.ok) throw new Error('load'); return res.json(); })
          .then((data) => {
            if (!data || !data.dealer) { $('pageLoading').classList.add('hidden'); $('pageError').classList.remove('hidden'); return; }
            render(data);
          })
          .catch(() => {
            $('pageLoading').innerHTML = '<p class="py-16 text-center text-sm text-gray-600">Could not load dealer profile. Please refresh.</p>';
          });

        if (window.CarfoxAuth) CarfoxAuth.initBuyerNav();
      })();
    </script>
  </body>
</html>
