<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
      <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1f3d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CarFox" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <script src="/js/carfox-pwa.js" defer></script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200">
      <div class="mx-auto max-w-md px-4 h-14 flex items-center justify-between">
        <a href="/" class="text-lg font-extrabold tracking-tight"><span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span></a>
        <span class="text-sm font-semibold">Reset password</span>
        <a id="backLink" href="/buyer/login.html" class="text-sm text-gray-600 hover:text-gray-900">Sign in</a>
      </div>
    </header>

    <main class="mx-auto max-w-md px-4 py-8">
      <div class="bg-white border border-gray-200 rounded-2xl p-6">
        <!-- Step 1: email -->
        <section id="stepEmail">
          <h1 class="text-xl font-bold">Forgot your password?</h1>
          <p class="mt-1 text-sm text-gray-600">Enter your account email and we'll send a 6-digit code.</p>
          <form id="emailForm" class="mt-5 space-y-4" novalidate>
            <label class="block">
              <span class="block text-sm font-semibold text-gray-700 mb-1">Email</span>
              <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </label>
            <p id="emailError" class="hidden text-sm text-red-700"></p>
            <button id="emailBtn" type="submit" class="w-full rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3">Send code</button>
          </form>
        </section>

        <!-- Step 2: code + new password -->
        <section id="stepReset" class="hidden">
          <h1 class="text-xl font-bold">Enter your code</h1>
          <p class="mt-1 text-sm text-gray-600">If an account exists for <strong id="emailTarget"></strong>, a code is on its way. It expires in 15 minutes.</p>
          <form id="resetForm" class="mt-5 space-y-4" novalidate>
            <label class="block">
              <span class="block text-sm font-semibold text-gray-700 mb-1">6-digit code</span>
              <input id="code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="––––––" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-center text-2xl tracking-[0.5em] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </label>
            <label class="block">
              <span class="block text-sm font-semibold text-gray-700 mb-1">New password</span>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
              <span class="block text-xs text-gray-500 mt-1">At least 8 characters.</span>
            </label>
            <label class="block">
              <span class="block text-sm font-semibold text-gray-700 mb-1">Confirm new password</span>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
            </label>
            <p id="resetError" class="hidden text-sm text-red-700"></p>
            <button id="resetBtn" type="submit" class="w-full rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3">Set new password</button>
          </form>
          <p class="mt-4 text-center text-sm text-gray-600">
            Didn't get it? <button type="button" id="resendBtn" class="text-blue-700 font-semibold hover:underline">Resend code</button>
            <span id="resendStatus" class="block mt-1 text-xs text-gray-500"></span>
          </p>
        </section>

        <!-- Step 3: done -->
        <section id="stepDone" class="hidden text-center">
          <div class="mx-auto h-12 w-12 rounded-full bg-green-100 text-green-700 flex items-center justify-center text-2xl">✓</div>
          <h1 class="mt-3 text-xl font-bold">Password updated</h1>
          <p class="mt-1 text-sm text-gray-600">You can sign in with your new password now.</p>
          <a id="doneLink" href="/buyer/login.html" class="mt-5 inline-flex w-full items-center justify-center rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold py-3">Sign in</a>
        </section>
      </div>
    </main>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const role = params.get('role') === 'dealer' ? 'dealer' : 'buyer';
        const loginHref = role === 'dealer' ? '/dealer/login.html' : '/buyer/login.html';
        document.getElementById('backLink').href = loginHref;
        document.getElementById('doneLink').href = loginHref;

        const emailInput = document.getElementById('email');
        if (params.get('email')) emailInput.value = params.get('email');

        const $ = (id) => document.getElementById(id);
        function showError(id, msg) { const el = $(id); el.textContent = msg; el.classList.remove('hidden'); }
        function hideError(id) { $(id).classList.add('hidden'); }

        async function requestCode(email) {
          const res = await fetch('/api/auth/forgot-password', {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || 'Could not send the code. Please try again.');
        }

        $('emailForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          hideError('emailError');
          const email = emailInput.value.trim();
          if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showError('emailError', 'Enter a valid email address.'); return; }
          const btn = $('emailBtn'); btn.disabled = true; btn.textContent = 'Sending…';
          try {
            await requestCode(email);
            $('emailTarget').textContent = email;
            $('stepEmail').classList.add('hidden');
            $('stepReset').classList.remove('hidden');
            $('code').focus();
          } catch (err) {
            showError('emailError', err.message);
          } finally {
            btn.disabled = false; btn.textContent = 'Send code';
          }
        });

        $('resendBtn').addEventListener('click', async () => {
          const status = $('resendStatus');
          status.textContent = 'Sending…';
          try { await requestCode($('emailTarget').textContent); status.textContent = 'If the account exists, a new code was sent.'; }
          catch (_) { status.textContent = 'Could not resend right now.'; }
        });

        $('resetForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          hideError('resetError');
          const code = $('code').value.trim();
          const password = $('password').value;
          const confirm = $('confirm').value;
          if (!/^\d{6}$/.test(code)) { showError('resetError', 'Enter the 6-digit code from your email.'); return; }
          if (password.length < 8) { showError('resetError', 'Password must be at least 8 characters.'); return; }
          if (password !== confirm) { showError('resetError', 'Passwords do not match.'); return; }
          const btn = $('resetBtn'); btn.disabled = true; btn.textContent = 'Saving…';
          try {
            const res = await fetch('/api/auth/reset-password', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: $('emailTarget').textContent, code, password })
            });
            const body = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(body.error || 'Could not reset the password.');
            $('stepReset').classList.add('hidden');
            $('stepDone').classList.remove('hidden');
          } catch (err) {
            showError('resetError', err.message);
          } finally {
            btn.disabled = false; btn.textContent = 'Set new password';
          }
        });
      })();
    </script>
  </body>
</html>
