<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1220" />
    <title>Admin sign in • CarFox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script src="/js/carfox-admin-auth.js"></script>
    <script src="/js/carfox-ui.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="min-h-full bg-[#0b1220] text-slate-100 font-sans antialiased">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-sm">
        <div class="flex items-center justify-center gap-2 mb-6">
          <span class="text-2xl font-extrabold tracking-tight"><span class="text-white">Car</span><span class="text-orange-500">Fox</span></span>
          <span class="rounded-md border border-slate-700 bg-slate-800/80 px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider text-slate-300">Admin</span>
        </div>

        <form id="adminLoginForm" class="rounded-2xl border border-slate-800 bg-slate-900/80 p-6 shadow-2xl shadow-black/40" novalidate>
          <h1 class="text-lg font-bold text-white">Sign in to the admin panel</h1>
          <p class="mt-1 text-sm text-slate-400">For CarFox staff only. Dealers and buyers sign in on the <a href="/" class="text-orange-400 hover:text-orange-300 underline-offset-2 hover:underline">main site</a>.</p>

          <div id="loginError" class="hidden mt-4 rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-200" role="alert"></div>
          <div id="loginNotice" class="hidden mt-4 rounded-lg border border-slate-700 bg-slate-800/70 px-3 py-2 text-sm text-slate-300" role="status"></div>

          <label for="adminEmail" class="block mt-5 text-sm font-medium text-slate-300">Email</label>
          <input id="adminEmail" name="email" type="email" autocomplete="username" required
                 class="mt-1.5 w-full rounded-lg border border-slate-700 bg-slate-950/60 px-3 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" />

          <label for="adminPassword" class="block mt-4 text-sm font-medium text-slate-300">Password</label>
          <div class="relative mt-1.5">
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required
                   class="w-full rounded-lg border border-slate-700 bg-slate-950/60 py-2.5 pl-3 pr-10 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500" />
            <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 flex items-center text-slate-400 hover:text-slate-200" aria-label="Show password">
              <span class="password-toggle-eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></span>
              <span class="password-toggle-eye-off hidden" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg></span>
            </button>
          </div>

          <button id="adminLoginBtn" type="submit"
                  class="mt-6 w-full rounded-lg bg-orange-500 hover:bg-orange-600 disabled:opacity-60 disabled:cursor-not-allowed px-4 py-2.5 text-sm font-semibold text-white">
            Sign in
          </button>
          <p class="mt-4 text-xs text-slate-500">Admin sessions expire after 12 hours. Signing in here doesn't affect a dealer or buyer session in this browser.</p>
        </form>
      </div>
    </main>

    <script>
      (function () {
        const form = document.getElementById('adminLoginForm');
        const emailEl = document.getElementById('adminEmail');
        const pwEl = document.getElementById('adminPassword');
        const btn = document.getElementById('adminLoginBtn');
        const errEl = document.getElementById('loginError');
        const noticeEl = document.getElementById('loginNotice');

        // Only ever return to an admin page on this site.
        function destination() {
          const raw = new URLSearchParams(location.search).get('returnTo') || '';
          return /^\/admin\/(?!login\.html)[^/][^\s]*$/.test(raw) && raw.indexOf('//') === -1 ? raw : '/admin/index.html';
        }
        function showError(msg) {
          noticeEl.classList.add('hidden');
          errEl.textContent = msg;
          errEl.classList.remove('hidden');
        }

        // Show/hide password — same behaviour as the site's login pages.
        document.querySelectorAll('.password-toggle').forEach(function (t) {
          t.addEventListener('click', function () {
            const input = t.parentElement.querySelector('input');
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            t.querySelector('.password-toggle-eye').classList.toggle('hidden', show);
            t.querySelector('.password-toggle-eye-off').classList.toggle('hidden', !show);
            t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          });
        });

        // Already signed in (valid, unexpired admin token): straight to the panel.
        if (CarfoxAdminAuth.token()) {
          fetch('/api/admin/me', { headers: { Authorization: 'Bearer ' + CarfoxAdminAuth.token() } })
            .then(function (r) { if (r.ok) location.replace(destination()); else CarfoxAdminAuth.clear(); })
            .catch(function () {});
        } else if (new URLSearchParams(location.search).get('returnTo')) {
          noticeEl.textContent = 'Please sign in to continue.';
          noticeEl.classList.remove('hidden');
        }

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          errEl.classList.add('hidden');
          const email = emailEl.value.trim();
          const password = pwEl.value;
          if (!email || !password) { showError('Please enter email and password.'); return; }
          btn.disabled = true;
          btn.textContent = 'Signing in…';
          try {
            const res = await fetch('/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: email, password: password })
            });
            const body = await res.json().catch(function () { return {}; });
            if (!res.ok || !body.token) {
              showError(body.error || 'Sign in failed. Please try again.');
              return;
            }
            CarfoxAdminAuth.save(body.token, body.user);
            location.replace(destination());
          } catch (_) {
            showError('Network error. Please try again.');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Sign in';
          }
        });
      })();
    </script>
  </body>
</html>
