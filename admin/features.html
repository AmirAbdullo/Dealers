<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin • Features • CarFox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
    <style>
      .badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px; font-size:12px; font-weight:600; border:1px solid; white-space:nowrap; }
      .btn-xs { display:inline-flex; align-items:center; justify-content:center; border-radius:8px; padding:6px 10px; font-size:13px; font-weight:600; white-space:nowrap; }
      .btn-xs:disabled { opacity:.5; cursor:not-allowed; }
      .input-xs { border:1px solid #d1d5db; border-radius:8px; padding:6px 8px; font-size:13px; background:#fff; }
      tr.inactive { opacity:.55; }
      tr.inactive td:first-child { box-shadow: inset 4px 0 0 #9ca3af; }
    </style>
  </head>
  <body class="bg-white text-gray-900 font-sans">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3 sm:gap-4 min-w-0">
          <a href="/" class="text-lg font-extrabold tracking-tight shrink-0">
            <span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span>
          </a>
          <span class="text-sm text-gray-500 hidden sm:inline">Admin</span>
          <nav class="flex items-center gap-1 text-sm font-semibold min-w-0 overflow-x-auto whitespace-nowrap">
            <a href="/admin/index.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Dashboard</a>
            <a href="/admin/applications.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Applications</a>
            <a href="/admin/dealers.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Dealers</a>
            <a href="/admin/listings.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Listings</a>
            <a href="/admin/users.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Users</a>
            <a href="/admin/trust-scores.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Trust</a>
            <a href="/admin/car-value.html" class="rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900">Value</a>
            <a href="/admin/features.html" class="rounded-lg px-3 py-1.5 bg-blue-50 text-blue-700" aria-current="page">Features</a>
          </nav>
        </div>
        <div class="flex items-center gap-3 text-sm shrink-0 pl-3">
          <span id="adminEmail" class="text-gray-700 hidden sm:inline">—</span>
          <button id="signOutBtn" class="text-gray-600 hover:text-gray-900 font-semibold">Sign Out</button>
        </div>
      </div>
    </header>

    <div id="toast" class="fixed top-3 inset-x-0 mx-auto max-w-md px-4 hidden z-[60]">
      <div id="toastInner" class="rounded-lg border p-3 text-sm shadow-md"></div>
    </div>

    <main class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-6 pb-16">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">Car features</h1>
          <p id="subtext" class="mt-1 text-sm text-gray-600">Loading…</p>
        </div>
      </div>

      <!-- Add -->
      <form id="addForm" class="mt-5 rounded-xl border border-gray-200 p-4 flex flex-wrap items-end gap-3">
        <label class="block flex-1 min-w-[180px]"><span class="text-xs font-semibold text-gray-600">New feature name</span><input id="addName" type="text" maxlength="60" required class="input-xs mt-1 w-full py-2" placeholder="e.g. Heads-up display" /></label>
        <label class="block"><span class="text-xs font-semibold text-gray-600">Category</span><select id="addCategory" class="input-xs mt-1 py-2"></select></label>
        <label class="block w-28"><span class="text-xs font-semibold text-gray-600">Sort order</span><input id="addSort" type="number" min="0" max="9999" step="1" class="input-xs mt-1 w-full py-2" placeholder="auto" /></label>
        <button type="submit" id="addBtn" class="btn-xs bg-blue-700 text-white hover:bg-blue-800 py-2">Add feature</button>
      </form>
      <p class="mt-2 text-xs text-gray-500">Deactivating a feature hides it from new dealer selections and buyer filters, but listings that already have it keep it. Lower sort order shows first within its category.</p>

      <div id="groups" class="mt-5 space-y-6"></div>
    </main>

    <script>
      const TOKEN_KEY = 'carfox_token';
      const USER_KEY = 'carfox_user';
      let categories = [];
      let features = [];

      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const authHeaders = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem(TOKEN_KEY) });
      function setToast(kind, message) {
        const inner = $('toastInner');
        inner.className = 'rounded-lg border p-3 text-sm shadow-md ' + (kind === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 'bg-green-50 border-green-200 text-green-800');
        inner.textContent = message;
        $('toast').classList.remove('hidden');
        clearTimeout(setToast._t);
        setToast._t = setTimeout(() => $('toast').classList.add('hidden'), 3500);
      }
      function categoryOptions(selected) {
        return categories.map((c) => '<option value="' + esc(c) + '"' + (c === selected ? ' selected' : '') + '>' + esc(c) + '</option>').join('');
      }

      function render() {
        const host = $('groups'); host.innerHTML = '';
        categories.forEach((cat) => {
          const list = features.filter((f) => f.category === cat);
          const sec = document.createElement('section');
          sec.innerHTML =
            '<div class="flex items-baseline justify-between"><h2 class="font-bold text-gray-900">' + esc(cat) + '</h2><span class="text-xs text-gray-500">' + list.filter((f) => f.active).length + ' active · ' + list.length + ' total</span></div>' +
            '<div class="mt-2 overflow-x-auto rounded-xl border border-gray-200"><table class="min-w-full text-sm"><thead class="bg-gray-50 text-left text-xs font-semibold uppercase tracking-wide text-gray-500"><tr>' +
            '<th class="px-4 py-2">Name</th><th class="px-4 py-2 w-40">Category</th><th class="px-4 py-2 w-28">Sort</th><th class="px-4 py-2 w-24 text-right">On listings</th><th class="px-4 py-2 w-32">Status</th></tr></thead>' +
            '<tbody class="divide-y divide-gray-100">' + (list.length ? list.map(row).join('') : '<tr><td colspan="5" class="px-4 py-4 text-sm text-gray-500">No features in this category.</td></tr>') + '</tbody></table></div>';
          host.appendChild(sec);
        });
        const active = features.filter((f) => f.active).length;
        $('subtext').textContent = features.length + ' features · ' + active + ' active · ' + (features.length - active) + ' deactivated';
      }
      function row(f) {
        return '<tr class="' + (f.active ? '' : 'inactive') + '" data-id="' + f.id + '">' +
          '<td class="px-4 py-2"><input type="text" value="' + esc(f.name) + '" maxlength="60" data-field="name" class="input-xs w-full" /></td>' +
          '<td class="px-4 py-2"><select data-field="category" class="input-xs w-full">' + categoryOptions(f.category) + '</select></td>' +
          '<td class="px-4 py-2"><input type="number" min="0" max="9999" value="' + f.sort_order + '" data-field="sort_order" class="input-xs w-full" /></td>' +
          '<td class="px-4 py-2 text-right text-gray-700">' + f.vehicle_count + '</td>' +
          '<td class="px-4 py-2">' + (f.active
            ? '<button class="btn-xs border border-gray-300 text-gray-700 hover:bg-gray-50" data-toggle="0">Deactivate</button>'
            : '<button class="btn-xs bg-green-600 text-white hover:bg-green-700" data-toggle="1">Activate</button>') + '</td>' +
          '</tr>';
      }

      async function load() {
        try {
          const res = await fetch('/api/admin/features', { headers: authHeaders() });
          if (res.status === 401 || res.status === 403) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); window.location.replace('/dealer/login.html'); return; }
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const d = await res.json();
          categories = d.categories; features = d.features;
          $('addCategory').innerHTML = categoryOptions(categories[0]);
          render();
        } catch (e) { $('subtext').textContent = 'Could not load features. Please refresh.'; }
      }
      async function update(id, body, okMsg) {
        try {
          const res = await fetch('/api/admin/features/' + id, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify(body) });
          const d = await res.json().catch(() => null);
          if (!res.ok) { setToast('error', d && d.error ? d.error : 'Could not update'); await load(); return false; }
          const i = features.findIndex((f) => f.id === id);
          if (i !== -1) features[i] = d.feature;
          render();
          if (okMsg) setToast('ok', okMsg);
          return true;
        } catch (_) { setToast('error', 'Network error'); return false; }
      }

      $('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = { name: $('addName').value.trim(), category: $('addCategory').value };
        if ($('addSort').value !== '') body.sort_order = Number($('addSort').value);
        $('addBtn').disabled = true;
        try {
          const res = await fetch('/api/admin/features', { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) });
          const d = await res.json().catch(() => null);
          if (!res.ok) { setToast('error', d && d.error ? d.error : 'Could not add'); return; }
          setToast('ok', 'Added "' + d.feature.name + '" to ' + d.feature.category);
          $('addName').value = ''; $('addSort').value = '';
          await load();
        } catch (_) { setToast('error', 'Network error'); }
        finally { $('addBtn').disabled = false; }
      });
      $('groups').addEventListener('change', (e) => {
        const el = e.target.closest('[data-field]'); if (!el) return;
        const id = Number(el.closest('tr').dataset.id);
        const f = features.find((x) => x.id === id);
        const field = el.dataset.field;
        const value = field === 'sort_order' ? Number(el.value) : el.value.trim();
        if (f && String(f[field]) === String(value)) return;
        update(id, { [field]: value }, field === 'name' ? 'Renamed to "' + value + '"' : field === 'category' ? 'Moved to ' + value : 'Sort order saved');
      });
      $('groups').addEventListener('click', (e) => {
        const b = e.target.closest('[data-toggle]'); if (!b) return;
        const id = Number(b.closest('tr').dataset.id);
        const active = b.dataset.toggle === '1';
        update(id, { active }, active ? 'Feature activated' : 'Feature deactivated — kept on existing listings');
      });
      $('signOutBtn').addEventListener('click', () => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); window.location.replace('/'); });

      (async function init() {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) { window.location.replace('/dealer/login.html'); return; }
        try {
          const me = await fetch('/api/auth/me', { headers: authHeaders() });
          if (me.status === 401) { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); window.location.replace('/dealer/login.html'); return; }
          const meData = await me.json();
          if (!meData || !meData.user || meData.user.role !== 'admin') { window.location.replace('/'); return; }
          $('adminEmail').textContent = meData.user.email || 'admin';
          await load();
        } catch (e) { $('subtext').textContent = 'Could not load. Please refresh.'; }
      })();
    </script>
  </body>
</html>
