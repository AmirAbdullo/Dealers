<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
          }
        }
      };
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans min-h-screen">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
      <div class="mx-auto max-w-md px-4 h-14 flex items-center justify-between">
        <a href="/" class="text-lg font-extrabold tracking-tight">
          <span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span>
        </a>
        <span class="text-sm font-semibold text-gray-700">Sign In</span>
        <a href="/" class="p-2 text-gray-500 hover:text-gray-900" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12l-4.89 4.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/>
          </svg>
        </a>
      </div>
    </header>

    <main class="mx-auto max-w-md px-4 py-8">
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-900">Sign in</h1>
        <p class="mt-1 text-sm text-gray-600">Welcome back to CarFox.</p>

        <div id="returnToBanner" class="hidden mt-4 rounded-lg border border-blue-200 bg-blue-50 text-blue-900 p-3 text-sm">
          Sign in to contact the dealer
        </div>
        <div id="formError" class="hidden mt-4 rounded-lg border border-red-200 bg-red-50 text-red-800 text-sm p-3"></div>
        <div id="roleError" class="hidden mt-4 rounded-lg border border-amber-200 bg-amber-50 text-amber-900 text-sm p-4"></div>
        <div id="verifyBanner" class="hidden mt-4 rounded-lg border border-amber-300 bg-amber-50 text-amber-900 text-sm p-4">
          <div class="flex items-start gap-2">
            <span class="text-lg leading-none">📧</span>
            <div class="flex-1">
              <p id="verifyBannerMsg" class="font-medium"></p>
              <button type="button" id="resendVerifyLink"
                class="mt-2 font-semibold text-amber-900 underline hover:text-amber-700">
                Resend verification email
              </button>
              <p id="verifyResendStatus" class="hidden mt-2"></p>
            </div>
          </div>
        </div>

        <button type="button" disabled
          class="mt-6 w-full inline-flex items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-3 text-sm font-semibold text-gray-500 opacity-50 cursor-not-allowed">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <p class="mt-1 text-center text-xs text-gray-500">Coming soon</p>

        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
          <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-gray-500">or</span></div>
        </div>

        <form id="loginForm" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email"
              class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="relative mt-1">
              <input id="password" name="password" type="password" required autocomplete="current-password"
                class="block w-full rounded-lg border border-gray-300 px-3 py-2 pr-10 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
              <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Show password">
                <span class="password-toggle-eye" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg></span>
                <span class="password-toggle-eye-off hidden" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"/></svg></span>
              </button>
            </div>
          </div>
          <button id="submitBtn" type="submit"
            class="w-full rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold px-4 py-3 transition">
            Sign In
          </button>
        </form>

        <p class="mt-4 text-center text-sm">
          <span class="text-gray-400 cursor-default">Forgot password?</span>
        </p>

        <p class="mt-6 text-center text-sm text-gray-600">
          New here?
          <a href="/buyer/signup.html" class="text-blue-700 font-semibold hover:underline">Create an account</a>
        </p>

        <div class="border-t border-gray-200 my-4"></div>
        <a href="/dealer/login.html" class="block text-center text-sm text-gray-600 hover:text-blue-700">
          Are you a dealer? <span class="text-blue-700 font-medium">Sign in here</span>
        </a>
      </div>
    </main>

    <script src="/js/carfox-auth.js"></script>
    <script>
      const TOKEN_KEY = 'carfox_token';
      const USER_KEY = 'carfox_user';

      function postLoginRedirect() {
        if (window.CarfoxAuth) {
          const dest = CarfoxAuth.parseReturnToRedirect();
          if (dest) return dest;
        }
        return '/cars.html';
      }

      if (window.CarfoxAuth && CarfoxAuth.parseReturnToRedirect()) {
        document.getElementById('returnToBanner').classList.remove('hidden');
      }
      const form = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitBtn');
      const formError = document.getElementById('formError');
      const roleError = document.getElementById('roleError');
      const verifyBanner = document.getElementById('verifyBanner');

      function hideAlerts() {
        formError.classList.add('hidden');
        formError.textContent = '';
        roleError.classList.add('hidden');
        roleError.innerHTML = '';
        verifyBanner.classList.add('hidden');
      }

      function showVerifyBanner(message) {
        document.getElementById('verifyBannerMsg').textContent =
          message || 'Please verify your email before logging in.';
        const status = document.getElementById('verifyResendStatus');
        status.classList.add('hidden');
        status.textContent = '';
        verifyBanner.classList.remove('hidden');
      }

      async function resendVerification() {
        const status = document.getElementById('verifyResendStatus');
        const email = prompt('Enter your email to resend the verification link:', form.email.value.trim());
        if (!email) return;
        const link = document.getElementById('resendVerifyLink');
        link.disabled = true;
        const orig = link.textContent;
        link.textContent = 'Sending...';
        try {
          await fetch('/api/auth/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email })
          });
          status.textContent = 'If that email is unverified, a new link was sent. Check your inbox.';
          status.className = 'mt-2 text-green-700';
        } catch (err) {
          status.textContent = 'Could not resend right now. Please try again later.';
          status.className = 'mt-2 text-red-700';
        } finally {
          link.disabled = false;
          link.textContent = orig;
          status.classList.remove('hidden');
        }
      }

      document.getElementById('resendVerifyLink').addEventListener('click', resendVerification);

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideAlerts();

        submitBtn.disabled = true;
        const orig = submitBtn.textContent;
        submitBtn.textContent = 'Signing in...';

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: form.email.value.trim(),
              password: form.password.value
            })
          });
          const body = await res.json().catch(function () { return {}; });

          if (res.status === 200 && body.token) {
            const role = body.user && body.user.role;
            if (role === 'buyer') {
              localStorage.setItem(TOKEN_KEY, body.token);
              localStorage.setItem(USER_KEY, JSON.stringify(body.user));
              window.location.href = postLoginRedirect();
              return;
            }
            if (role === 'dealer' || role === 'admin') {
              roleError.innerHTML =
                '<p class="font-medium">This account is a dealer account.</p>' +
                '<p class="mt-2"><a href="/dealer/login.html" class="text-blue-700 font-semibold underline hover:text-blue-800">Sign in to the dealer portal →</a></p>';
              roleError.classList.remove('hidden');
              return;
            }
          }
          if (res.status === 401) {
            formError.textContent = 'Invalid email or password';
            formError.classList.remove('hidden');
            return;
          }
          if (res.status === 403) {
            const msg = body.error || 'Access denied.';
            if (/verify your email/i.test(msg)) {
              showVerifyBanner(msg);
            } else {
              formError.textContent = msg;
              formError.classList.remove('hidden');
            }
            return;
          }
          formError.textContent = body.error || 'Something went wrong. Please try again.';
          formError.classList.remove('hidden');
        } catch (err) {
          formError.textContent = 'Network error. Please try again.';
          formError.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = orig;
        }
      });

      document.querySelectorAll('.password-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var wrap = btn.parentElement;
          var input = wrap.querySelector('input');
          var eye = btn.querySelector('.password-toggle-eye');
          var eyeOff = btn.querySelector('.password-toggle-eye-off');
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          eye.classList.toggle('hidden', show);
          eyeOff.classList.toggle('hidden', !show);
          btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
      });
    </script>
  </body>
</html>
