<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Saved Cars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
          }
        }
      };
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans min-h-screen pb-28">
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200 h-16">
      <div class="mx-auto max-w-lg px-4 h-full grid grid-cols-3 items-center">
        <a href="/" class="text-lg font-extrabold tracking-tight justify-self-start">
          <span class="text-blue-700">Car</span><span class="text-orange-500">Fox</span>
        </a>
        <h1 class="text-base font-bold text-gray-900 text-center justify-self-center">Saved Cars</h1>
        <span class="justify-self-end w-8" aria-hidden="true"></span>
      </div>
    </header>

    <div id="pageLoading" class="px-4 py-16 text-center text-sm text-gray-600">Loading saved cars…</div>

    <main id="pageContent" class="hidden px-4 py-4 max-w-lg mx-auto">
      <div id="emptyState" class="hidden py-16 text-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-300 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <p class="mt-4 text-lg font-semibold text-gray-900">No saved cars yet</p>
        <p class="mt-2 text-sm text-gray-600 max-w-xs mx-auto">Browse cars and tap the heart to save them.</p>
        <a href="/cars.html" class="inline-block mt-6 rounded-lg bg-blue-700 hover:bg-blue-800 text-white font-semibold px-6 py-3">Browse cars</a>
      </div>
      <div id="carGrid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 z-[100] md:hidden border-t border-gray-200 bg-white h-16" style="padding-bottom: env(safe-area-inset-bottom);">
      <div class="mx-auto max-w-7xl grid grid-cols-4 h-full">
        <a href="/index.html" class="flex flex-col items-center justify-center text-gray-600 hover:text-gray-900">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.172 2.25 10.5V21h6.75v-6h6v6h6V10.5L12 3.172z"/></svg>
          <span class="text-[11px] leading-tight mt-1">Home</span>
        </a>
        <a href="/cars.html" class="flex flex-col items-center justify-center text-gray-600 hover:text-gray-900">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 3a7.5 7.5 0 0 1 5.3 12.8l4.2 4.2-1.4 1.4-4.2-4.2A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
          <span class="text-[11px] leading-tight mt-1">Browse</span>
        </a>
        <a href="/buyer/inbox.html" class="relative flex flex-col items-center justify-center text-gray-600 hover:text-gray-900">
          <span class="relative inline-flex">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span data-messages-unread-dot class="hidden absolute -top-0.5 -right-0.5 h-2 w-2 rounded-full bg-red-500" aria-hidden="true"></span>
          </span>
          <span class="text-[11px] leading-tight mt-1">Messages</span>
        </a>
        <a href="/buyer/account.html" data-nav="account" class="flex flex-col items-center justify-center text-gray-600 hover:text-gray-900">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5z"/></svg>
          <span class="text-[11px] leading-tight mt-1">Account</span>
        </a>
      </div>
    </nav>

    <script src="/js/carfox-auth.js"></script>
    <script src="/js/carfox-buyer-nav.js"></script>
    <script>
      (function () {
        const esc = CarfoxBuyerNav.escapeHtml;
        const fmtPrice = CarfoxBuyerNav.formatPriceCents;
        const vehTitle = CarfoxBuyerNav.vehicleTitle;

        const pageLoading = document.getElementById('pageLoading');
        const pageContent = document.getElementById('pageContent');
        const emptyState = document.getElementById('emptyState');
        const carGrid = document.getElementById('carGrid');

        let session = null;
        let savedIds = new Set();

        function formatMileage(km) {
          if (km == null || km === '' || Number(km) <= 0) return '—';
          return Number(km).toLocaleString('en-US') + ' km';
        }

        function carIconSvg() {
          return '<svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8 17h8M6 11h12l-1-4H7l-1 4zM5 11l1.5-6h11L19 11"/><circle cx="7.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="17.5" r="1.5" fill="currentColor" stroke="none"/></svg>';
        }

        function heartSvg(saved) {
          if (saved) {
            return '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="#ef4444" xmlns="http://www.w3.org/2000/svg">' +
              '<path d="M12 21s-6.7-4.9-9.3-7.6C.7 11.4.5 8.5 2.2 6.8 3.3 5.7 4.8 5.3 6.2 5.6c.9.2 1.8.8 2.5 1.5.7-.7 1.6-1.3 2.5-1.5 1.4-.3 2.9.1 4 1.2 1.7 1.7 1.5 4.6-.5 6.6C18.7 16.1 12 21 12 21z"/></svg>';
          }
          return '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" xmlns="http://www.w3.org/2000/svg">' +
            '<path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>';
        }

        function toggleSave(carId, btn, cardEl) {
          const isSaved = savedIds.has(carId);
          if (isSaved) { savedIds.delete(carId); } else { savedIds.add(carId); }
          btn.innerHTML = heartSvg(!isSaved);
          btn.setAttribute('aria-label', !isSaved ? 'Remove from saved' : 'Save car');
          // On this page, unsaving removes the card after a short delay
          if (isSaved && cardEl) {
            cardEl.style.transition = 'opacity 300ms';
            cardEl.style.opacity = '0';
            setTimeout(function () { if (cardEl.parentNode) cardEl.parentNode.removeChild(cardEl); checkEmpty(); }, 320);
          }
          fetch('/api/saved-cars/' + carId, {
            method: isSaved ? 'DELETE' : 'POST',
            headers: { Authorization: 'Bearer ' + session.token }
          }).catch(function () {
            // Revert
            if (isSaved) { savedIds.add(carId); } else { savedIds.delete(carId); }
            btn.innerHTML = heartSvg(isSaved);
          });
        }

        function checkEmpty() {
          if (!carGrid.children.length) {
            carGrid.classList.add('hidden');
            emptyState.classList.remove('hidden');
          }
        }

        function renderCard(car) {
          const title = vehTitle(car);
          const subtitle = (car.trim && String(car.trim).trim()) || car.body_type || '';
          const city = (car.dealer && car.dealer.city) ? car.dealer.city : '';
          let photoHtml;
          if (car.primary_photo_url) {
            photoHtml =
              '<div class="aspect-[4/3] overflow-hidden bg-gray-100">' +
              '<img src="' + esc(car.primary_photo_url) + '" alt="" class="w-full h-full object-cover" loading="lazy" />' +
              '</div>';
          } else {
            photoHtml =
              '<div class="aspect-[4/3] bg-gray-100 flex items-center justify-center overflow-hidden">' +
              carIconSvg() +
              '</div>';
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'relative';

          const card = document.createElement('a');
          card.href = '/cars/' + car.id;
          card.className = 'block bg-white rounded-lg border border-gray-200 overflow-hidden hover:shadow-lg transition-shadow';
          card.innerHTML = photoHtml +
            '<div class="p-3">' +
            '<h2 class="text-sm font-semibold text-gray-900 truncate">' + esc(title) + '</h2>' +
            (subtitle ? '<p class="text-xs text-gray-500 mt-0.5 truncate">' + esc(subtitle) + '</p>' : '') +
            '<p class="text-lg font-bold text-blue-700 mt-2">' + esc(fmtPrice(car.price)) + '</p>' +
            '<div class="flex items-center justify-between text-xs text-gray-500 mt-2">' +
            '<span>' + esc(formatMileage(car.mileage)) + '</span>' +
            '<span class="truncate ml-2 text-right">' + esc(city) + '</span>' +
            '</div></div>';

          savedIds.add(car.id);
          const heartBtn = document.createElement('button');
          heartBtn.type = 'button';
          heartBtn.className = 'save-btn absolute top-2 right-2 z-10 bg-white/90 rounded-full p-1.5 shadow';
          heartBtn.setAttribute('data-id', String(car.id));
          heartBtn.setAttribute('aria-label', 'Remove from saved');
          heartBtn.innerHTML = heartSvg(true);
          heartBtn.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggleSave(car.id, heartBtn, wrapper);
          });

          wrapper.appendChild(card);
          wrapper.appendChild(heartBtn);
          return wrapper;
        }

        CarfoxBuyerNav.requireBuyerPageAuth('/buyer/saved-cars.html').then(function (s) {
          if (!s) return;
          session = s;
          if (window.CarfoxAuth) CarfoxAuth.applyAccountNavRouting();
          CarfoxBuyerNav.initMessagesUnreadBadge();

          return fetch('/api/saved-cars/listings', {
            headers: { Authorization: 'Bearer ' + session.token }
          });
        }).then(function (res) {
          if (!res) return;
          if (!res.ok) throw new Error('load failed');
          return res.json();
        }).then(function (data) {
          if (!data) return;
          pageLoading.classList.add('hidden');
          pageContent.classList.remove('hidden');
          const cars = data.cars || [];
          if (!cars.length) {
            emptyState.classList.remove('hidden');
            return;
          }
          cars.forEach(function (car) { carGrid.appendChild(renderCard(car)); });
        }).catch(function () {
          pageLoading.textContent = 'Could not load saved cars. Please refresh.';
        });
      })();
    </script>
  </body>
</html>
