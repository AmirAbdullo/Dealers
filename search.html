<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CarFox — Advanced Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
    </script>
    <style>
      .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid #e2e8f0; background:#fff; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:#334155; }
      .chip[aria-pressed="true"] { background:#1d4ed8; border-color:#1d4ed8; color:#fff; }
      .make-card { border:1px solid #e5e7eb; background:#fff; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px 4px; gap:6px; }
      .make-card[aria-pressed="true"] { border-color:#1d4ed8; box-shadow:0 0 0 2px #bfdbfe inset; background:#eff6ff; }
      .make-card .name { font-size:11px; font-weight:600; color:#374151; text-align:center; line-height:1.1; }
      .num { width:100%; border:1px solid #cbd5e1; border-radius:10px; padding:10px 12px; font-size:14px; background:#fff; }
      .num:focus, select.num:focus { outline:2px solid #93c5fd; border-color:#3b82f6; }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <!-- Top bar -->
    <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
      <div class="mx-auto max-w-3xl px-4 h-14 flex items-center justify-between">
        <a href="/cars.html" class="flex items-center gap-2 text-gray-700 hover:text-gray-900" aria-label="Back">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          <span class="text-sm font-semibold hidden sm:inline">Back</span>
        </a>
        <h1 class="text-base font-bold">Advanced Filters</h1>
        <button type="button" id="clearAllTop" class="text-sm font-semibold text-blue-700">Clear all</button>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-5 pb-40 space-y-4">
      <section class="bg-white border border-gray-200 rounded-xl p-4">
        <div class="flex items-center justify-between"><h2 class="font-semibold">Region</h2><span id="regionSummary" class="text-xs text-gray-500">All regions</span></div>
        <div id="regionChips" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4">
        <div class="flex items-center justify-between"><h2 class="font-semibold">Make</h2><span id="makeSummary" class="text-xs text-gray-500">Any make</span></div>
        <div id="makeGrid" class="mt-3 grid grid-cols-4 sm:grid-cols-6 gap-2"></div>
        <button type="button" id="makeToggle" class="mt-3 text-sm font-semibold text-blue-700">Show all makes</button>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4">
        <div class="flex items-center justify-between"><h2 class="font-semibold">Model</h2><span id="modelSummary" class="text-xs text-gray-500">Any model</span></div>
        <select id="modelSelect" class="num mt-3" disabled><option value="">Select one make first</option></select>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4">
        <h2 class="font-semibold">Year</h2>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">From</span><select id="minYear" class="num"><option value="">Any</option></select></label>
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">To</span><select id="maxYear" class="num"><option value="">Any</option></select></label>
        </div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4">
        <h2 class="font-semibold">Price <span class="text-xs font-normal text-gray-500">(EGP)</span></h2>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">Min</span><input id="minPrice" class="num" inputmode="numeric" placeholder="No min" /></label>
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">Max</span><input id="maxPrice" class="num" inputmode="numeric" placeholder="No max" /></label>
        </div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="mileage">
        <h2 class="font-semibold">Mileage <span class="text-xs font-normal text-gray-500">(km)</span></h2>
        <div class="mt-3 grid grid-cols-2 gap-3">
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">Min</span><input id="minMileage" class="num" inputmode="numeric" placeholder="No min" /></label>
          <label class="block"><span class="block text-xs font-semibold text-gray-600 mb-1">Max</span><input id="maxMileage" class="num" inputmode="numeric" placeholder="No max" /></label>
        </div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="body_type">
        <h2 class="font-semibold">Body type</h2>
        <div id="bodyChips" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="transmission">
        <h2 class="font-semibold">Transmission</h2>
        <div id="transChips" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="fuel_type">
        <h2 class="font-semibold">Fuel type</h2>
        <div id="fuelChips" class="mt-3 flex flex-wrap gap-2"></div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="color">
        <h2 class="font-semibold">Color</h2>
        <div id="colorChips" class="mt-3 flex flex-wrap gap-2"><span class="text-sm text-gray-500">Loading…</span></div>
      </section>

      <section class="bg-white border border-gray-200 rounded-xl p-4" data-section="features">
        <h2 class="font-semibold">Features</h2>
        <p class="text-xs text-gray-500 mt-0.5">Cars must have every feature you pick.</p>
        <div id="featureGroups" class="mt-3 space-y-3"><span class="text-sm text-gray-500">Loading…</span></div>
      </section>
    </main>

    <!-- Sticky results bar (sits above the mobile bottom nav) -->
    <div class="fixed left-0 right-0 bottom-16 md:bottom-0 z-[90] bg-white/95 backdrop-blur border-t border-gray-200" style="padding-bottom: env(safe-area-inset-bottom);">
      <div class="mx-auto max-w-3xl px-4 py-3 flex items-center gap-3">
        <button type="button" id="clearAllBottom" class="text-sm font-semibold text-gray-600 px-2">Clear</button>
        <button type="button" id="showResults" class="flex-1 rounded-xl bg-blue-700 hover:bg-blue-800 text-white text-base font-bold py-3.5">Show Results</button>
      </div>
    </div>

    <script src="/js/carfox-auth.js"></script>
    <script src="/js/carfox-buyer-nav.js"></script>
    <script src="/js/carfox-quick-search.js"></script>
    <script>
      (function () {
        const BODY_TYPES = ['Sedan', 'SUV', 'Hatchback', 'Coupe', 'Pickup', 'Van', 'Wagon', 'Convertible', 'Other'];
        const TRANSMISSIONS = ['Automatic', 'Manual', 'CVT', 'Semi-Automatic'];
        const FUELS = ['Gasoline', 'Diesel', 'Hybrid', 'Electric', 'LPG', 'Other'];
        // Popular = first 12 makes in the admin catalog order (same list as before the catalog existed).
        let POPULAR_MAKES = ['Toyota', 'Hyundai', 'Kia', 'Nissan', 'Mercedes-Benz', 'BMW', 'Chevrolet', 'Honda', 'Volkswagen', 'Peugeot', 'Renault', 'Mitsubishi'];
        let GOV_LIST = CarfoxQuickSearch.GOVERNORATES.slice();
        let CATALOG = null;
        function logoFor(name) {
          const m = CATALOG && CATALOG.makes.find(x => x.name === name);
          return (m && m.logo_url) || brandLogoUrl(name);
        }
        function catalogModels(make) {
          const m = CATALOG && CATALOG.makes.find(x => x.name.toLowerCase() === String(make).toLowerCase());
          return m ? m.models.map(x => x.name) : [];
        }
        function applySections(search) {
          const sections = (search && search.sections) || {};
          document.querySelectorAll('[data-section]').forEach(el => el.classList.toggle('hidden', sections[el.dataset.section] === false));
        }
        const CURRENT_YEAR = new Date().getFullYear();

        const f = {
          city: [], make: [], model: '', min_year: null, max_year: null, min_price: null, max_price: null,
          min_mileage: null, max_mileage: null, body_type: [], transmission: '', fuel_type: [], color: [], features: []
        };
        let allMakes = [];
        let showAllMakes = false;
        let countTimer = null;

        const $ = (id) => document.getElementById(id);
        const fmt = (n) => Number(n).toLocaleString('en-US');
        const parseNum = (raw) => { const v = String(raw || '').replace(/[^0-9]/g, ''); if (!v) return null; const n = parseInt(v, 10); return isNaN(n) ? null : n; };

        function brandLogoUrl(brand) {
          if (brand === 'Mercedes-Benz' || brand === 'Mercedes') return 'https://www.carlogos.org/car-logos/mercedes-benz-logo.png';
          return 'https://www.carlogos.org/car-logos/' + String(brand).toLowerCase().replace(/\s+/g, '-') + '-logo.png';
        }

        // ---------- URL <-> state ----------
        function readUrl() {
          const p = new URLSearchParams(location.search);
          const list = (k) => p.has(k) ? p.get(k).split(',').map(s => s.trim()).filter(Boolean) : [];
          f.city = list('city'); f.make = list('make'); f.body_type = list('body_type'); f.fuel_type = list('fuel_type'); f.color = list('color');
          f.features = list('features').map(s => parseInt(s, 10)).filter(n => Number.isInteger(n) && n > 0);
          f.model = p.has('model') ? p.get('model').trim() : '';
          f.transmission = p.has('transmission') ? p.get('transmission').trim() : '';
          ['min_year', 'max_year', 'min_price', 'max_price', 'min_mileage', 'max_mileage'].forEach(k => { f[k] = p.has(k) ? parseNum(p.get(k)) : null; });
          if (f.make.length !== 1) f.model = '';
        }
        function params() {
          const p = new URLSearchParams();
          if (f.city.length) p.set('city', f.city.join(','));
          if (f.make.length) p.set('make', f.make.join(','));
          if (f.model && f.make.length === 1) p.set('model', f.model);
          if (f.body_type.length) p.set('body_type', f.body_type.join(','));
          if (f.fuel_type.length) p.set('fuel_type', f.fuel_type.join(','));
          if (f.color.length) p.set('color', f.color.join(','));
          if (f.features.length) p.set('features', f.features.join(','));
          if (f.transmission) p.set('transmission', f.transmission);
          ['min_year', 'max_year', 'min_price', 'max_price', 'min_mileage', 'max_mileage'].forEach(k => { if (f[k] != null) p.set(k, String(f[k])); });
          return p;
        }

        // ---------- rendering ----------
        function chipList(host, options, key, single) {
          host.innerHTML = '';
          options.forEach(opt => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'chip'; b.textContent = opt;
            const pressed = single ? f[key] === opt : f[key].indexOf(opt) !== -1;
            b.setAttribute('aria-pressed', pressed ? 'true' : 'false');
            b.addEventListener('click', () => {
              if (single) f[key] = f[key] === opt ? '' : opt;
              else { const i = f[key].indexOf(opt); if (i === -1) f[key].push(opt); else f[key].splice(i, 1); }
              chipList(host, options, key, single);
              afterChange();
            });
            host.appendChild(b);
          });
        }

        function renderRegion() {
          const host = $('regionChips');
          host.innerHTML = '';
          const all = document.createElement('button');
          all.type = 'button'; all.className = 'chip'; all.textContent = 'All regions';
          all.setAttribute('aria-pressed', f.city.length ? 'false' : 'true');
          all.addEventListener('click', () => { f.city = []; renderRegion(); afterChange(); });
          host.appendChild(all);
          GOV_LIST.forEach(g => {
            const b = document.createElement('button');
            b.type = 'button'; b.className = 'chip'; b.textContent = g;
            b.setAttribute('aria-pressed', f.city.indexOf(g) !== -1 ? 'true' : 'false');
            b.addEventListener('click', () => { const i = f.city.indexOf(g); if (i === -1) f.city.push(g); else f.city.splice(i, 1); renderRegion(); afterChange(); });
            host.appendChild(b);
          });
          $('regionSummary').textContent = f.city.length ? f.city.join(', ') : 'All regions';
        }

        function renderMakes() {
          const host = $('makeGrid');
          host.innerHTML = '';
          const visible = showAllMakes ? allMakes : allMakes.filter(m => POPULAR_MAKES.indexOf(m) !== -1 || f.make.indexOf(m) !== -1);
          visible.forEach(m => {
            const card = document.createElement('button');
            card.type = 'button'; card.className = 'make-card';
            card.setAttribute('aria-pressed', f.make.indexOf(m) !== -1 ? 'true' : 'false');
            const img = document.createElement('img');
            img.src = logoFor(m); img.alt = ''; img.width = 36; img.height = 36; img.loading = 'lazy'; img.className = 'w-9 h-9 object-contain';
            const fb = document.createElement('div');
            fb.className = 'hidden w-9 h-9 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center text-sm font-bold';
            fb.textContent = m.charAt(0);
            img.addEventListener('error', () => { img.classList.add('hidden'); fb.classList.remove('hidden'); });
            const name = document.createElement('span'); name.className = 'name'; name.textContent = m;
            card.appendChild(img); card.appendChild(fb); card.appendChild(name);
            card.addEventListener('click', () => {
              const i = f.make.indexOf(m); if (i === -1) f.make.push(m); else f.make.splice(i, 1);
              if (f.make.length !== 1) f.model = '';
              renderMakes(); loadModels(); afterChange();
            });
            host.appendChild(card);
          });
          $('makeToggle').textContent = showAllMakes ? 'Show fewer makes' : 'Show all makes';
          $('makeSummary').textContent = f.make.length ? f.make.join(', ') : 'Any make';
        }

        function loadModels() {
          const sel = $('modelSelect');
          if (f.make.length !== 1) {
            sel.innerHTML = '<option value="">' + (f.make.length ? 'Pick a single make to choose a model' : 'Select one make first') + '</option>';
            sel.disabled = true; $('modelSummary').textContent = 'Any model'; return;
          }
          sel.disabled = false;
          sel.innerHTML = '<option value="">Any model</option>';
          Promise.resolve({ models: catalogModels(f.make[0]) }).then(d => {
            (d.models || []).forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; sel.appendChild(o); });
            sel.value = f.model || '';
            $('modelSummary').textContent = f.model || 'Any model';
          }).catch(() => {});
        }

        function renderYears() {
          [['minYear', 'min_year'], ['maxYear', 'max_year']].forEach(([id, key]) => {
            const sel = $(id);
            sel.innerHTML = '<option value="">Any</option>';
            for (let y = CURRENT_YEAR; y >= 1990; y--) { const o = document.createElement('option'); o.value = String(y); o.textContent = String(y); sel.appendChild(o); }
            sel.value = f[key] != null ? String(f[key]) : '';
            sel.onchange = () => { f[key] = sel.value ? parseInt(sel.value, 10) : null; afterChange(); };
          });
        }

        function bindNumber(id, key) {
          const el = $(id);
          el.value = f[key] != null ? fmt(f[key]) : '';
          el.addEventListener('focus', () => { el.value = el.value.replace(/,/g, ''); });
          el.addEventListener('input', () => { const d = el.value.replace(/[^0-9]/g, ''); if (el.value !== d) el.value = d; f[key] = parseNum(d); afterChange(); });
          el.addEventListener('blur', () => { if (f[key] != null) el.value = fmt(f[key]); });
        }

        function renderFeatures() {
          const host = $('featureGroups');
          const list = window.__features || [];
          host.innerHTML = '';
          if (!list.length) { host.innerHTML = '<span class="text-sm text-gray-500">No features available yet.</span>'; return; }
          const cats = [];
          list.forEach(x => { if (cats.indexOf(x.category) === -1) cats.push(x.category); });
          cats.forEach(cat => {
            const wrap = document.createElement('div');
            wrap.innerHTML = '<p class="text-xs font-semibold uppercase tracking-wide text-gray-500">' + String(cat).replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]) + '</p>';
            const row = document.createElement('div');
            row.className = 'mt-1.5 flex flex-wrap gap-2';
            list.filter(x => x.category === cat).forEach(x => {
              const b = document.createElement('button');
              b.type = 'button'; b.className = 'chip'; b.textContent = x.name;
              b.setAttribute('aria-pressed', f.features.indexOf(x.id) !== -1 ? 'true' : 'false');
              b.addEventListener('click', () => { const i = f.features.indexOf(x.id); if (i === -1) f.features.push(x.id); else f.features.splice(i, 1); renderFeatures(); afterChange(); });
              row.appendChild(b);
            });
            wrap.appendChild(row);
            host.appendChild(wrap);
          });
        }

        function renderColors(colors) {
          const host = $('colorChips');
          if (!colors.length) { host.innerHTML = '<span class="text-sm text-gray-500">No colors available yet.</span>'; return; }
          chipList(host, colors, 'color', false);
        }

        function updateCount() {
          clearTimeout(countTimer);
          countTimer = setTimeout(() => {
            const qs = params().toString();
            fetch('/api/cars/count' + (qs ? '?' + qs : '')).then(r => r.ok ? r.json() : null).then(d => {
              if (!d || typeof d.total !== 'number') return;
              $('showResults').textContent = 'Show ' + fmt(d.total) + ' Result' + (d.total === 1 ? '' : 's');
            }).catch(() => {});
          }, 250);
        }

        function afterChange() {
          const qs = params().toString();
          history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
          updateCount();
        }

        function clearAll() {
          Object.assign(f, { city: [], make: [], model: '', min_year: null, max_year: null, min_price: null, max_price: null, min_mileage: null, max_mileage: null, body_type: [], transmission: '', fuel_type: [], color: [], features: [] });
          renderAll();
          afterChange();
        }

        function renderAll() {
          renderRegion(); renderMakes(); loadModels(); renderYears();
          ['minPrice', 'maxPrice', 'minMileage', 'maxMileage'].forEach(id => { const key = id.replace(/([A-Z])/g, '_$1').toLowerCase(); $(id).value = f[key] != null ? fmt(f[key]) : ''; });
          chipList($('bodyChips'), BODY_TYPES, 'body_type', false);
          chipList($('transChips'), TRANSMISSIONS, 'transmission', true);
          chipList($('fuelChips'), FUELS, 'fuel_type', false);
          if (window.__colors) renderColors(window.__colors);
          if (window.__features) renderFeatures();
        }

        // ---------- init ----------
        readUrl();
        bindNumber('minPrice', 'min_price'); bindNumber('maxPrice', 'max_price');
        bindNumber('minMileage', 'min_mileage'); bindNumber('maxMileage', 'max_mileage');
        $('modelSelect').addEventListener('change', () => { f.model = $('modelSelect').value; $('modelSummary').textContent = f.model || 'Any model'; afterChange(); });
        $('makeToggle').addEventListener('click', () => { showAllMakes = !showAllMakes; renderMakes(); });
        $('clearAllTop').addEventListener('click', clearAll);
        $('clearAllBottom').addEventListener('click', clearAll);
        $('showResults').addEventListener('click', () => { const qs = params().toString(); location.href = '/cars.html' + (qs ? '?' + qs : ''); });

        fetch('/api/catalog').then(r => r.json()).then(c => {
          CATALOG = c;
          if (c.governorates && c.governorates.length) GOV_LIST = c.governorates.map(g => g.name);
          if (c.makes && c.makes.length >= 12) POPULAR_MAKES = c.makes.slice(0, 12).map(m => m.name);
          applySections(c.search);
          allMakes = (c.makes || []).map(m => m.name);
          f.make.forEach(m => { if (allMakes.indexOf(m) === -1) allMakes.push(m); });
          renderAll();
          updateCount();
        }).catch(() => { renderAll(); });

        fetch('/api/cars/filter-options').then(r => r.json()).then(d => {
          window.__colors = (d.colors || []).map(c => c.name);
          renderColors(window.__colors);
        }).catch(() => { renderColors([]); });
        fetch('/api/features').then(r => r.json()).then(d => {
          window.__features = d.features || [];
          renderFeatures();
        }).catch(() => { window.__features = []; renderFeatures(); });
      })();
    </script>
  </body>
</html>
